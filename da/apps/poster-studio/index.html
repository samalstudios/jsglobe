    <h1>Poster Studio</h1>
    <p>Design posters and social variants with an event QR. Dette værktøj kører helt i din browser: intet, du indsætter eller åbner, forlader din enhed.</p>
    <h2>Hvad Poster Studio gør</h2>
    <p>Poster Studio hører til afsnittet Medier i Toolbox og står der ved siden af 8 beslægtede værktøjer. Det åbner med det samme på https://jsglobe.com/da/apps/poster-studio, bliver ved med at virke uden forbindelse, når siden først er indlæst, og gemmer det, du gemmer, i denne browser i stedet for på en server.</p>
    <p>Også nyttigt til: poster, flyer, design, layout, template, event, qr, social, instagram, story, banner, print, typography.</p>
    <h2>Sådan virker det</h2>
    <ul>
      <li>Åbn siden og gå i gang. Ingen konto, ingen tilmelding, ingen betalingsmur.</li>
      <li>Alt kører som JavaScript i din egen browser, så det, du taster ind, når aldrig en server.</li>
      <li>Indstillinger og gemt arbejde ligger i denne browser og kan ryddes når som helst.</li>
      <li>Hele webstedet er åben kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørgsmål</h2>
    <dl>
      <dt>Er Poster Studio gratis?</dt><dd>Ja. Poster Studio er gratis at bruge, uden konto, uden tilmelding og uden grænser for brugen.</dd><dt>Uploader Poster Studio mine data?</dt><dd>Nej. Det kører helt i din browser, så den tekst, de filer og de billeder, du giver det, forlader aldrig din enhed.</dd><dt>Virker Poster Studio uden forbindelse?</dt><dd>Ja. Når siden først er indlæst, bliver værktøjet ved med at virke uden forbindelse.</dd><dt>Hvor finder jeg kildekoden?</dt><dd>Toolbox er åben kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslægtede værktøjer</h2>
    <ul><li><a href="https://jsglobe.com/da/apps/qr-generator">QR Code</a> - Generate scannable QR codes offline</li><li><a href="https://jsglobe.com/da/apps/image-converter">Image Converter</a> - Convert, resize and compress images in the browser</li><li><a href="https://jsglobe.com/da/apps/media-converter">Video &amp; Audio</a> - Transcode video and audio with WebAssembly</li><li><a href="https://jsglobe.com/da/apps/barcode-generator">Barcode</a> - Code 128, EAN and Code 39 barcodes as SVG</li><li><a href="https://jsglobe.com/da/apps/icon-studio">Icon Studio</a> - Build an icon from thousands of parts, or describe one</li><li><a href="https://jsglobe.com/da/apps/favicon-generator">Favicon Maker</a> - Every icon size, an .ico and the manifest</li><li><a href="https://jsglobe.com/da/apps/exif-editor">Exif Metadata</a> - Read and strip metadata from JPEG photos</li><li><a href="https://jsglobe.com/da/apps/mp3-metadata">MP3 Metadata</a> - Edit ID3 tags and artwork on MP3 files</li></ul>
