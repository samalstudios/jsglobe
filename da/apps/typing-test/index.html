    <h1>Skrivetest</h1>
    <p>Ord i minuttet, træfsikkerhed og besværlige taster. Dette værktøj kører helt i din browser: intet, du indsætter eller åbner, forlader din enhed.</p>
    <h2>Hvad Skrivetest gør</h2>
    <p>Skrivetest hører til afsnittet Spil i Toolbox og står der ved siden af 8 beslægtede værktøjer. Det åbner med det samme på https://jsglobe.com/da/apps/typing-test, bliver ved med at virke uden forbindelse, når siden først er indlæst, og gemmer det, du gemmer, i denne browser i stedet for på en server.</p>
    <p>Også nyttigt til: typing, wpm, speed, keyboard, accuracy, practice.</p>
    <h2>Sådan virker det</h2>
    <ul>
      <li>Åbn siden og gå i gang. Ingen konto, ingen tilmelding, ingen betalingsmur.</li>
      <li>Alt kører som JavaScript i din egen browser, så det, du taster ind, når aldrig en server.</li>
      <li>Indstillinger og gemt arbejde ligger i denne browser og kan ryddes når som helst.</li>
      <li>Hele webstedet er åben kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørgsmål</h2>
    <dl>
      <dt>Er Skrivetest gratis?</dt><dd>Ja. Skrivetest er gratis at bruge, uden konto, uden tilmelding og uden grænser for brugen.</dd><dt>Uploader Skrivetest mine data?</dt><dd>Nej. Det kører helt i din browser, så den tekst, de filer og de billeder, du giver det, forlader aldrig din enhed.</dd><dt>Virker Skrivetest uden forbindelse?</dt><dd>Ja. Når siden først er indlæst, bliver værktøjet ved med at virke uden forbindelse.</dd><dt>Hvor finder jeg kildekoden?</dt><dd>Toolbox er åben kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
