    <h1>JSON Schema</h1>
    <p>Infer a schema from samples and validate documents. Dette værktøj kører helt i din browser: intet, du indsætter eller åbner, forlader din enhed.</p>
    <h2>Hvad JSON Schema gør</h2>
    <p>JSON Schema hører til afsnittet Udvikling i Toolbox og står der ved siden af 8 beslægtede værktøjer. Det åbner med det samme på https://jsglobe.com/da/apps/json-schema, bliver ved med at virke uden forbindelse, når siden først er indlæst, og gemmer det, du gemmer, i denne browser i stedet for på en server.</p>
    <p>Også nyttigt til: json schema, validate, infer, draft, contract, api.</p>
    <h2>Sådan virker det</h2>
    <ul>
      <li>Åbn siden og gå i gang. Ingen konto, ingen tilmelding, ingen betalingsmur.</li>
      <li>Alt kører som JavaScript i din egen browser, så det, du taster ind, når aldrig en server.</li>
      <li>Indstillinger og gemt arbejde ligger i denne browser og kan ryddes når som helst.</li>
      <li>Hele webstedet er åben kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørgsmål</h2>
