    <h1>Hash af tekst</h1>
    <p>MD5-, SHA-1-, SHA-256- og SHA-512-summer. Dette værktøj kører helt i din browser: intet, du indsætter eller åbner, forlader din enhed.</p>
    <h2>Hvad Hash af tekst gør</h2>
    <p>Hash af tekst hører til afsnittet Krypto og sikkerhed i Toolbox og står der ved siden af 8 beslægtede værktøjer. Det åbner med det samme på https://jsglobe.com/da/apps/hash-text, bliver ved med at virke uden forbindelse, når siden først er indlæst, og gemmer det, du gemmer, i denne browser i stedet for på en server.</p>
    <p>Også nyttigt til: hash, md5, sha, sha256, checksum, digest.</p>
    <h2>Sådan virker det</h2>
    <ul>
      <li>Åbn siden og gå i gang. Ingen konto, ingen tilmelding, ingen betalingsmur.</li>
      <li>Alt kører som JavaScript i din egen browser, så det, du taster ind, når aldrig en server.</li>
      <li>Indstillinger og gemt arbejde ligger i denne browser og kan ryddes når som helst.</li>
      <li>Hele webstedet er åben kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørgsmål</h2>
    <dl>
      <dt>Er Hash af tekst gratis?</dt><dd>Ja. Hash af tekst er gratis at bruge, uden konto, uden tilmelding og uden grænser for brugen.</dd><dt>Uploader Hash af tekst mine data?</dt><dd>Nej. Det kører helt i din browser, så den tekst, de filer og de billeder, du giver det, forlader aldrig din enhed.</dd><dt>Virker Hash af tekst uden forbindelse?</dt><dd>Ja. Når siden først er indlæst, bliver værktøjet ved med at virke uden forbindelse.</dd><dt>Hvor finder jeg kildekoden?</dt><dd>Toolbox er åben kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
