    <h1>Privatlivspolitik</h1>
    <p>Toolbox er et statisk websted. Hvert værktøj kører i din browser, og den tekst, de filer og de billeder, du bruger, uploades aldrig.</p>
    <h2>Cookies</h2>
    <p>Google Analytics 4 indlæses først, når du accepterer cookiebanneret, med anonymiseret IP og uden lagring til annoncer eller tilpasning. At afvise sætter ingen analysecookies. Du kan ændre valget når som helst på denne side eller i indstillingerne.</p>
    <h2>Lokale data</h2>
    <p>Noter, opgaver, indstillinger og apptilstand ligger i denne browsers local storage og IndexedDB og kan slettes i indstillingerne under Data. Der er ingen konti og ingen indsamling af e-mailadresser.</p>
    <h2>Tredjeparter</h2>
    <p>Nogle værktøjer kalder kun en åben tjeneste, når du beder om det, som DNS-resolvere til opslag, Cloudflare til hastighedstesten, CoinGecko og et åbent valutakursdatasæt til porteføljepriser, og åbne CDN'er til AI-modeller og mediecodecs.</p>
    <h2>Kildekode</h2>
    <p>Webstedet er åben kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</p>
