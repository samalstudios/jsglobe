    <h1>Forbehold</h1>
    <p>Værktøjerne på Toolbox er forenklede modeller, holdt op mod gennemregnede eksempler, men de udelader ting. Se hvert resultat som et udgangspunkt, der skal bekræftes.</p>
    <h2>Ikke faglig rådgivning</h2>
    <p>Intet her er juridisk, skattemæssig, økonomisk, lægelig eller teknisk rådgivning, og brugen skaber ikke noget rådgivningsforhold. Spørg en fagkyndig, der kender din situation, når noget får virkelige følger.</p>
    <h2>Data fra andre steder</h2>
    <p>Nogle værktøjer henter data fra åbne tjenester, når du beder om det, som valutakurser, priser og domæneopslag. De data tilhører tjenesterne, kan være forsinkede eller forkerte, og sendes videre, som de kommer, uden nogen kontrol.</p>
    <h2>Tilbydes som de er</h2>
    <p>Disse værktøjer kommer uden nogen form for garanti. De kan indeholde fejl, være utilgængelige, ændre sig eller forsvinde. I det omfang loven tillader det, påtages der intet ansvar for tab, der følger af at bruge dem eller at stole på det, de giver.</p>
    <h2>Læs koden</h2>
    <p>Webstedet er åben kildekode, så du kan se præcis, hvad et værktøj gør, i stedet for at tage det på ordet. Fejl er værd at melde.</p>
