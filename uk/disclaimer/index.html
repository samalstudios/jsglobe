    <h1>Застереження</h1>
    <p>Інструменти в Toolbox - спрощені моделі, звірені з розрахованими прикладами, але дещо вони оминають. Сприймайте кожен результат як відправну точку, яку слід підтвердити.</p>
    <h2>Це не фахова порада</h2>
    <p>Ніщо тут не є юридичною, податковою, фінансовою, медичною чи інженерною порадою, і користування цим не створює жодних фахових відносин. Якщо справа має справжні наслідки, спитайте того, хто має відповідні знання і знає вашу ситуацію.</p>
    <h2>Дані ззовні</h2>
    <p>Деякі інструменти на ваш запит беруть дані з відкритих служб: курси валют, ціни, відомості про домени. Ці дані належать тим службам, можуть запізнюватися чи бути хибними і передаються далі такими, якими надійшли, без перевірки.</p>
    <h2>Надаються як є</h2>
    <p>Ці інструменти надаються без жодних гарантій. Вони можуть містити помилки, бути недоступними, змінюватися чи зникнути. У межах, дозволених законом, не приймається жодна відповідальність за втрати через користування ними або через довіру до того, що вони дають.</p>
    <h2>Прочитайте код</h2>
    <p>Сайт має відкритий код, тож ви можете перевірити, що саме робить кожен інструмент, а не вірити йому на слово. Про помилки варто повідомляти.</p>
