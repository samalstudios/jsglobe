="https://jsglobe.com/uk/apps/todo">Завдання</a> - Легкий список справ для кожного робочого простору</li><li><a href="https://jsglobe.com/uk/apps/image-converter">Перетворення зображень</a> - Перетворюйте, змінюйте розмір і стискайте зображення у браузері</li><li><a href="https://jsglobe.com/uk/apps/media-converter">Відео та звук</a> - Перекодовуйте відео й звук за допомогою WebAssembly</li><li><a href="https://jsglobe.com/uk/apps/ai-chat">ШІ-чат</a> - Спілкуйтеся з моделлю, що працює на цьому пристрої</li><li><a href="https://jsglobe.com/uk/apps/ai-code">ШІ-код</a> - Пояснення, огляд, документування та перетворення коду</li><li><a href="https://jsglobe.com/uk/apps/ai-writer">ШІ-редактор</a> - Скорочення, переписування, переклад і вичитування</li><li><a href="https://jsglobe.com/uk/apps/ai-translate">Переклад</a> - Перекладайте текст моделлю на цьому пристрої</li><li><a href="https://jsglobe.com/uk/apps/ai-regex">ШІ-регвирази</a> - Опишіть взірець і отримайте перевірений регвираз</li><li><a href="https://jsglobe.com/uk/apps/dns-lookup">Запити DNS</a> - Запити записів у дусі dig через DNS-over-HTTPS</li><li><a href="https://jsglobe.com/uk/apps/speed-test">Тест швидкості</a> - Виміряйте завантаження, віддачу, затримку й джитер</li><li><a href="https://jsglobe.com/uk/apps/barcode-generator">Штрихкод</a> - Коди 128, EAN і Code 39 у форматі SVG</li><li><a href="https://jsglobe.com/uk/apps/timezone-planner">Часові пояси</a> - Зіставте міста й знайдіть спільні години</li><li><a href="https://jsglobe.com/uk/apps/currency-converter">Валюти</a> - Переводьте валюти за щоденними курсами</li><li><a href="https://jsglobe.com/uk/apps/http-headers">Огляд заголовків</a> - Оцініть заголовки відповіді щодо безпеки й приватності</li><li><a href="https://jsglobe.com/uk/apps/csv-studio">Студія CSV</a> - Відкривайте, редагуйте й перетворюйте дані CSV у таблиці</li><li><a href="https://jsglobe.com/uk/apps/mock-data">Тестові дані</a> - Створюйте правдоподібні дані за переліком полів</li><li
