    <h1>Сканер кодів</h1>
    <p>Зчитуйте QR і штрихкоди з камери, зображення або екрана. Цей інструмент працює повністю у вашому браузері: ніщо з того, що ви вставляєте чи відкриваєте, не залишає пристрій.</p>
    <h2>Що робить Сканер кодів</h2>
    <p>Сканер кодів належить до розділу Інструменти у Toolbox і стоїть там поруч зі спорідненими інструментами (8). Він відкривається одразу за адресою https://jsglobe.com/uk/apps/scanner, працює далі без мережі після завантаження сторінки і зберігає збережене в цьому браузері, а не на сервері.</p>
    <p>Стане в пригоді також для: qr, barcode, scan, reader, camera, ean, upc, code 128, decode, screenshot.</p>
    <h2>Як це працює</h2>
    <ul>
      <li>Відкрийте сторінку і починайте. Без облікового запису, без реєстрації, без оплати.</li>
      <li>Усе працює як JavaScript у вашому власному браузері, тож введене ніколи не сягає сервера.</li>
      <li>Налаштування і збережена робота лежать у цьому браузері, і їх можна будь-коли стерти.</li>
      <li>Увесь сайт має відкритий код за адресою <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Питання</h2>
    <dl>
      <dt>Чи Сканер кодів безкоштовний?</dt><dd>Так. Сканер кодів можна користуватися безкоштовно, без облікового запису, без реєстрації і без обмежень.</dd><dt>Чи надсилає Сканер кодів мої дані?</dt><dd>Ні. Він працює повністю у вашому браузері, тож текст, файли та зображення, які ви йому даєте, ніколи не залишають пристрій.</dd><dt>Чи працює Сканер кодів без мережі?</dt><dd>Так. Щойно сторінка завантажилася, інструмент працює далі без з’єднання.</dd><dt>Де знайти вихідний код?</dt><dd>Toolbox має відкритий код за адресою https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Споріднені інструменти</h2>
    <ul><li><a href="https://jsglobe.com/uk/apps/uuid-generator">UUID</a> - Створюйте ідентифікатори v4 та v7 партіями</li><li><a href="https://jsglobe.com/uk/apps/device-info">Про пристрій</a> - Усе, що браузер знає про цей пристрій</li><li><a href="https://jsglobe.com/uk/apps/clock">Годинник</a> - Світовий час, секундомір і таймер</li><li><a href="https://jsglobe.com/uk/apps/calendar">Календар</a> - Огляд місяця з подіями для кожного робочого простору</li><li><a href="https://jsglobe.com/uk/apps/portfolio">Портфель</a> - Стежте за активами, розподілом і прибутком чи збитком</li><li><a href="https://jsglobe.com/uk/apps/notes">Нотатки</a> - Швидкі записи, збережені в цьому робочому просторі</li><li><a href="https://jsglobe.com/uk/apps/todo">Завдання</a> - Легкий список справ для кожного робочого простору</li><li><a href="https://jsglobe.com/uk/apps/timezone-planner">Часові пояси</a> - Зіставте міста й знайдіть спільні години</li></ul>
