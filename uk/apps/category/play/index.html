    <h1>Інструменти: Ігри</h1>
    <p>Інструменти для Ігри (19), що працюють у вашому браузері, безкоштовно й без облікового запису. Ніщо з того, що ви вставляєте чи відкриваєте, не надсилається.</p>
    <ul><li><a href="https://jsglobe.com/uk/apps/typing-test">Тест набору</a> - Слова за хвилину, точність і проблемні клавіші</li><li><a href="https://jsglobe.com/uk/apps/chess">Шахи</a> - Грайте з комп’ютером, вивчайте дебюти й тренуйте тактику</li><li><a href="https://jsglobe.com/uk/apps/game-sudoku">Судоку</a> - Створені головоломки з нотатками й підказками</li><li><a href="https://jsglobe.com/uk/apps/game-tetris">Блоки</a> - Складайте фігури, що падають, і збирайте рядки</li><li><a href="https://jsglobe.com/uk/apps/game-memory">Пам’ять</a> - Перевертайте картки й шукайте однакові пари</li><li><a href="https://jsglobe.com/uk/apps/game-word">Вгадай слово</a> - Шість спроб, щоб знайти слово з п’яти літер</li><li><a href="https://jsglobe.com/uk/apps/drum-kit">Барабани</a> - Грайте на пелюстках і складайте ритм на 16 кроків</li><li><a href="https://jsglobe.com/uk/apps/tuner">Тюнер</a> - Налаштуйте гітару, бас чи укулеле на слух або через мікрофон</li><li><a href="https://jsglobe.com/uk/apps/midi-keyboard">MIDI-клавіатура</a> - Синтезатор, на якому грають з клавіатури або через MIDI</li><li><a href="https://jsglobe.com/uk/apps/game-2048">2048</a> - Зсувайте й зливайте плитки, щоб дійти до 2048</li><li><a href="https://jsglobe.com/uk/apps/game-minesweeper">Сапер</a> - Розчистіть поле, не натрапивши на міну</li><li><a href="https://jsglobe.com/uk/apps/game-snake">Змійка</a> - Їжте, ростіть і не кусайте себе</li><li><a href="https://jsglobe.com/uk/apps/game-breakout">Арканоїд</a> - Відбивайте м’яч і вибивайте всі цеглинки</li><li><a href="https://jsglobe.com/uk/apps/game-pong">Понг</a> - Первісний двобій ракеток проти машини</li><li><a href="https://jsglobe.com/uk/apps/game-invaders">Загарбники</a> - Тримайте оборону проти хвиль, що спускаються</li><li><a href="https://jsglobe.com/uk/apps/game-solitaire">Пасьянс</a> - Косинка з добором однієї або трьох карт</li><li><a href="https://jsglobe.com/uk/apps/game-dino">Біг тиранозавра</a> - Перестрибуйте кактуси в грі без мере
