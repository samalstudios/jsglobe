    <h1>TOTP</h1>
    <p>Одноразові паролі за часом із секретного ключа. Цей інструмент працює повністю у вашому браузері: ніщо з того, що ви вставляєте чи відкриваєте, не залишає пристрій.</p>
    <h2>Що робить TOTP</h2>
    <p>TOTP належить до розділу Криптографія та безпека у Toolbox і стоїть там поруч зі спорідненими інструментами (8). Він відкривається одразу за адресою https://jsglobe.com/uk/apps/otp-generator, працює далі без мережі після завантаження сторінки і зберігає збережене в цьому браузері, а не на сервері.</p>
    <p>Стане в пригоді також для: otp, totp, 2fa, mfa, authenticator.</p>
    <h2>Як це працює</h2>
    <ul>
      <li>Відкрийте сторінку і починайте. Без облікового запису, без реєстрації, без оплати.</li>
      <li>Усе працює як JavaScript у вашому власному браузері, тож введене ніколи не сягає сервера.</li>
      <li>Налаштування і збережена робота лежать у цьому браузері, і їх можна будь-коли стерти.</li>
      <li>Увесь сайт має відкритий код за адресою <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Питання</h2>
    <dl>
      <dt>Чи TOTP безкоштовний?</dt><dd>Так. TOTP можна користуватися безкоштовно, без облікового запису, без реєстрації і без обмежень.</dd><dt>Чи надсилає TOTP мої дані?</dt><dd>Ні. Він працює повністю у вашому браузері, тож текст, файли та зображення, які ви йому даєте, ніколи не залишають пристрій.</dd><dt>Чи працює TOTP без мережі?</dt><dd>Так. Щойно сторінка завантажилася, інструмент працює далі без з’єднання.</dd><dt>Де знайти вихідний код?</dt><dd>Toolbox має відкритий код за адресою https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Споріднені інструменти</h2>
    <ul><li><a href="https://jsglobe.com/uk/apps/hash-text">Хеш тексту</a> - Згортки MD5, SHA-1, SHA-256, SHA-512</li><li><a href="https://jsglobe.com/uk/apps/hmac-generator">HMAC</a> - Коди автентичності повідомлень із ключем</li><li><a href="https://jsglobe.com/uk/apps/encryption">Шифрування</a> - Шифрування тексту AES-GCM за парольною фразою</li><li><a href="https://jsglobe.com/uk/apps/token-generator">Генератор токенів</a> - Надійні випадкові паролі та токени API</li><li><a href="https://jsglobe.com/uk/apps/basic-auth">Базова автентифікація</a> - Складіть заголовок Authorization з облікових даних</li><li><a href="https://jsglobe.com/uk/apps/rsa-keygen">Пара ключів</a> - Створюйте ключі RSA та на еліптичних кривих у форматі PEM</li><li><a href="https://jsglobe.com/uk/apps/password-strength">Надійність пароля</a> - Ентропія, слабкі місця й час на зламування</li><li><a href="https://jsglobe.com/uk/apps/cert-decoder">Розбір сертифіката</a> - Прочитайте сертифікат X.509 або запит на підпис</li></ul>
