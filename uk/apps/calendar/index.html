    <h1>Calendar</h1>
    <p>Month view with events saved per workspace. Цей інструмент працює повністю у вашому браузері: ніщо з того, що ви вставляєте чи відкриваєте, не залишає пристрій.</p>
    <h2>Що робить Calendar</h2>
    <p>Calendar належить до розділу Інструменти у Toolbox і стоїть там поруч зі спорідненими інструментами (8). Він відкривається одразу за адресою https://jsglobe.com/uk/apps/calendar, працює далі без мережі після завантаження сторінки і зберігає збережене в цьому браузері, а не на сервері.</p>
    <p>Стане в пригоді також для: calendar, month, date, events, schedule, agenda.</p>
    <h2>Як це працює</h2>
    <ul>
      <li>Відкрийте сторінку і починайте. Без облікового запису, без реєстрації, без оплати.</li>
      <li>Усе працює як JavaScript у вашому власному браузері, тож введене ніколи не сягає сервера.</li>
      <li>Налаштування і збережена робота лежать у цьому браузері, і їх можна будь-коли стерти.</li>
      <li>Увесь сайт має відкритий код за адресою <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Питання</h2>
    <dl>
      <dt>Чи Calendar безкоштовний?</dt><dd>Так. Calendar можна користуватися безкоштовно, без облікового запису, без реєстрації і без обмежень.</dd><dt>Чи надсилає Calendar мої дані?</dt><dd>Ні. Він працює повністю у вашому браузері, тож текст, файли та зображення, які ви йому даєте, ніколи не залишають пристрій.</dd><dt>Чи працює Calendar без мережі?</dt><dd>Так. Щойно сторінка завантажилася, інструмент працює далі без з’єднання.</dd><dt>Де знайти вихідний код?</dt><dd>Toolbox має відкритий код за адресою https://github.com/samalstudios/jsglobe.</dd>
