    <h1>HTTP Status</h1>
    <p>Searchable reference of HTTP status codes. Цей інструмент працює повністю у вашому браузері: ніщо з того, що ви вставляєте чи відкриваєте, не залишає пристрій.</p>
    <h2>Що робить HTTP Status</h2>
    <p>HTTP Status належить до розділу Веб у Toolbox і стоїть там поруч зі спорідненими інструментами (8). Він відкривається одразу за адресою https://jsglobe.com/uk/apps/http-status, працює далі без мережі після завантаження сторінки і зберігає збережене в цьому браузері, а не на сервері.</p>
    <p>Стане в пригоді також для: http, status, code, reference, 404, 500.</p>
    <h2>Як це працює</h2>
    <ul>
      <li>Відкрийте сторінку і починайте. Без облікового запису, без реєстрації, без оплати.</li>
      <li>Усе працює як JavaScript у вашому власному браузері, тож введене ніколи не сягає сервера.</li>
      <li>Налаштування і збережена робота лежать у цьому браузері, і їх можна будь-коли стерти.</li>
      <li>Увесь сайт має відкритий код за адресою <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Питання</h2>
    <dl>
      <dt>Чи HTTP Status безкоштовний?</dt><dd>Так. HTTP Status можна користуватися безкоштовно, без облікового запису, без реєстрації і без обмежень.</dd><dt>Чи надсилає HTTP Status мої дані?</dt><dd>Ні. Він працює повністю у вашому браузері, тож текст, файли та зображення, які ви йому даєте, ніколи не залишають пристрій.</dd><dt>Чи працює HTTP Status без мережі?</dt><dd>Так. Щойно сторінка завантажилася, інструмент працює далі без з’єднання.</dd><dt>Де знайти вихідний код?</dt><dd>Toolbox має відкритий код за адресою https://github.com/samalstudios/jsglobe.</dd>
