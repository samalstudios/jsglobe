    <h1>Markdown</h1>
    <p>Пишіть markdown і дивіться готовий HTML. Цей інструмент працює повністю у вашому браузері: ніщо з того, що ви вставляєте чи відкриваєте, не залишає пристрій.</p>
    <h2>Що робить Markdown</h2>
    <p>Markdown належить до розділу Текст у Toolbox і стоїть там поруч зі спорідненими інструментами (7). Він відкривається одразу за адресою https://jsglobe.com/uk/apps/markdown-preview, працює далі без мережі після завантаження сторінки і зберігає збережене в цьому браузері, а не на сервері.</p>
    <p>Стане в пригоді також для: markdown, md, preview, html, render.</p>
    <h2>Як це працює</h2>
    <ul>
      <li>Відкрийте сторінку і починайте. Без облікового запису, без реєстрації, без оплати.</li>
      <li>Усе працює як JavaScript у вашому власному браузері, тож введене ніколи не сягає сервера.</li>
      <li>Налаштування і збережена робота лежать у цьому браузері, і їх можна будь-коли стерти.</li>
      <li>Увесь сайт має відкритий код за адресою <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Питання</h2>
    <dl>
      <dt>Чи Markdown безкоштовний?</dt><dd>Так. Markdown можна користуватися безкоштовно, без облікового запису, без реєстрації і без обмежень.</dd><dt>Чи надсилає Markdown мої дані?</dt><dd>Ні. Він працює повністю у вашому браузері, тож текст, файли та зображення, які ви йому даєте, ніколи не залишають пристрій.</dd><dt>Чи працює Markdown без мережі?</dt><dd>Так. Щойно сторінка завантажилася, інструмент працює далі без з’єднання.</dd><dt>Де знайти вихідний код?</dt><dd>Toolbox має відкритий код за адресою https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Споріднені інструменти</h2>
    <ul><li><a href="https://jsglobe.com/uk/apps/lorem-ipsum">Lorem Ipsum</a> - Текст-заповнювач словами, реченнями або списками</li><li><a href="https://jsglobe.com/uk/apps/text-stats">Статистика тексту</a> - Підрахунки, час читання й розбір символів</li><li><a href="https://jsglobe.com/uk/apps/text-diff">Порівняння текстів</a> - Порівняйте два тексти рядок за рядком</li><li><a href="https://jsglobe.com/uk/apps/emoji-picker">Емодзі</a> - Переглядайте, шукайте й копіюйте емодзі з кодовими позиціями</li><li><a href="https://jsglobe.com/uk/apps/unicode-tables">Таблиці Unicode</a> - Переглядайте блоки Unicode й розглядайте будь-який символ</li><li><a href="https://jsglobe.com/uk/apps/doc-editor">Студія документів</a> - Пишіть, форматуйте й вивантажуйте документи в PDF або Word, повністю у браузері</li><li><a href="https://jsglobe.com/uk/apps/letters">Літери</a> - Вивчайте грецьку, кирилицю, японську, корейську та китайську абетки</li></ul>
