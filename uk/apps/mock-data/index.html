    <h1>Тестові дані</h1>
    <p>Створюйте правдоподібні дані за переліком полів. Цей інструмент працює повністю у вашому браузері: ніщо з того, що ви вставляєте чи відкриваєте, не залишає пристрій.</p>
    <h2>Що робить Тестові дані</h2>
    <p>Тестові дані належить до розділу Розробка у Toolbox і стоїть там поруч зі спорідненими інструментами (8). Він відкривається одразу за адресою https://jsglobe.com/uk/apps/mock-data, працює далі без мережі після завантаження сторінки і зберігає збережене в цьому браузері, а не на сервері.</p>
    <p>Стане в пригоді також для: mock, fake, test data, seed, fixtures, json, csv, sql, faker.</p>
    <h2>Як це працює</h2>
    <ul>
      <li>Відкрийте сторінку і починайте. Без облікового запису, без реєстрації, без оплати.</li>
      <li>Усе працює як JavaScript у вашому власному браузері, тож введене ніколи не сягає сервера.</li>
      <li>Налаштування і збережена робота лежать у цьому браузері, і їх можна будь-коли стерти.</li>
      <li>Увесь сайт має відкритий код за адресою <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Питання</h2>
    <dl>
      <dt>Чи Тестові дані безкоштовний?</dt><dd>Так. Тестові дані можна користуватися безкоштовно, без облікового запису, без реєстрації і без обмежень.</dd><dt>Чи надсилає Тестові дані мої дані?</dt><dd>Ні. Він працює повністю у вашому браузері, тож текст, файли та зображення, які ви йому даєте, ніколи не залишають пристрій.</dd><dt>Чи працює Тестові дані без мережі?</dt><dd>Так. Щойно сторінка завантажилася, інструмент працює далі без з’єднання.</dd><dt>Де знайти вихідний код?</dt><dd>Toolbox має відкритий код за адресою https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Споріднені інструменти</h2>
    <ul><li><a href="https://jsglobe.com/uk/apps/json-formatter">Форматування JSON</a> - Форматуйте, перевіряйте, стискайте й переглядайте JSON</li><li><a href="https://jsglobe.com/uk/apps/json-diff">Порівняння JSON</a> - Порівняйте два документи JSON ключ за ключем</li><li><a href="https://jsglobe.com/uk/apps/sql-formatter">Форматування SQL</a> - Зручне для читання оформлення запитів SQL</li><li><a href="https://jsglobe.com/uk/apps/xml-formatter">Форматування XML</a> - Відступи й стиснення розмітки XML або HTML</li><li><a href="https://jsglobe.com/uk/apps/crontab-generator">Crontab</a> - Пояснення виразів cron і найближчі запуски</li><li><a href="https://jsglobe.com/uk/apps/chmod-calculator">Chmod</a> - Права Unix у вісімковому та символьному записі</li><li><a href="https://jsglobe.com/uk/apps/regex-tester">Перевірка регвиразів</a> - Випробовуйте взірці з живими збігами й групами</li><li><a href="https://jsglobe.com/uk/apps/csv-studio">Студія CSV</a> - Відкривайте, редагуйте й перетворюйте дані CSV у таблиці</li></ul>
