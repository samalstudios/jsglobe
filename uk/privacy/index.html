    <h1>Політика приватності</h1>
    <p>Toolbox - статичний сайт. Кожен інструмент працює у вашому браузері, а текст, файли та зображення, які ви використовуєте, ніколи не надсилаються.</p>
    <h2>Куки</h2>
    <p>Google Analytics 4 завантажується лише після того, як ви приймете повідомлення про куки, з анонімізацією IP і без сховища для реклами чи персоналізації. Відмова не встановлює жодних аналітичних куків. Вибір можна будь-коли змінити на цій сторінці або в налаштуваннях.</p>
    <h2>Локальні дані</h2>
    <p>Нотатки, завдання, налаштування і стан застосунків лежать у local storage та IndexedDB цього браузера, і їх можна стерти в налаштуваннях, у розділі Дані. Облікових записів немає, адреси пошти не збираються.</p>
    <h2>Треті сторони</h2>
    <p>Деякі інструменти звертаються до відкритої служби лише на ваш запит: DNS-резолвери для запитів, Cloudflare для тесту швидкості, CoinGecko і відкритий набір курсів валют для цін портфеля, а також відкриті CDN для моделей ШІ та медіакодеків.</p>
