    <h1>Datenschutzerklärung</h1>
    <p>Toolbox ist eine statische Website. Jedes Werkzeug läuft im Browser, und die verwendeten Texte, Dateien und Bilder werden niemals hochgeladen.</p>
    <h2>Cookies</h2>
    <p>Google Analytics 4 wird erst geladen, nachdem das Cookie-Banner akzeptiert wurde, mit IP-Anonymisierung und ohne Werbe- oder Personalisierungsspeicher. Bei Ablehnung werden keine Analytics-Cookies gesetzt. Die Wahl lässt sich jederzeit auf dieser Seite oder in den Einstellungen ändern.</p>
    <h2>Lokale Daten</h2>
    <p>Notizen, Aufgaben, Einstellungen und App-Zustand liegen im Local Storage und in der IndexedDB dieses Browsers und lassen sich in den Einstellungen unter Daten löschen. Es gibt keine Konten und keine E-Mail-Erfassung.</p>
    <h2>Dritte</h2>
    <p>Einige Werkzeuge rufen einen öffentlichen Dienst nur auf Anforderung auf, etwa DNS-Resolver für Abfragen, Cloudflare für den Speedtest, CoinGecko und einen offenen Wechselkursdatensatz für Portfoliopreise sowie öffentliche CDNs für KI-Modelle und Mediencodecs.</p>
    <h2>Quellcode</h2>
    <p>Die Website ist quelloffen unter <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</p>
    <p><a href="https://jsglobe.com/de/apps">Alle 118 Werkzeuge durchsuchen</a></p>
