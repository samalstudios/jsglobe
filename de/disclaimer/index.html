    <h1>Haftungsausschluss</h1>
    <p>Die Werkzeuge auf Toolbox sind vereinfachte Abbilder, gegen durchgerechnete Beispiele geprüft, lassen aber Dinge weg. Sieh jedes Ergebnis als Ausgangspunkt, der zu prüfen ist.</p>
    <h2>Keine fachliche Beratung</h2>
    <p>Nichts auf dieser Seite ist Rechts-, Steuer-, Finanz-, Medizin- oder Ingenieurberatung, und die Nutzung begründet kein Mandat. Wenn etwas wirkliche Folgen hat, frage jemanden mit Fachkunde, der deine Lage kennt.</p>
    <h2>Daten von anderswo</h2>
    <p>Einige Werkzeuge holen auf deine Anfrage hin Daten von öffentlichen Diensten, etwa Wechselkurse, Preise und Domainabfragen. Diese Daten gehören jenen Diensten, können verzögert oder falsch sein und werden ungeprüft so weitergegeben, wie sie ankommen.</p>
    <h2>So angeboten, wie sie sind</h2>
    <p>Diese Werkzeuge kommen ohne jede Gewährleistung. Sie können Fehler enthalten, nicht erreichbar sein und sich ändern oder verschwinden. Soweit das Gesetz es zulässt, wird keine Haftung für Schäden aus ihrer Nutzung oder aus dem Vertrauen auf ihre Ergebnisse übernommen.</p>
