    <h1>Token-Generator</h1>
    <p>Starke Zufallspasswörter und API-Tokens. Dieses Werkzeug läuft vollständig im Browser: Nichts, was eingefügt oder geöffnet wird, verlässt das Gerät.</p>
    <h2>Was Token-Generator macht</h2>
    <p>Token-Generator gehört zum Bereich Krypto &amp; Sicherheit von Toolbox und steht dort neben 8 verwandten Werkzeugen. Es öffnet sich sofort unter https://jsglobe.com/de/apps/token-generator, arbeitet nach dem Laden auch offline weiter und speichert alles in diesem Browser statt auf einem Server.</p>
    <p>Ebenfalls nützlich für: password, token, random, secret, entropy.</p>
    <h2>So funktioniert es</h2>
    <ul>
      <li>Seite öffnen und loslegen. Kein Konto, keine Anmeldung, keine Bezahlschranke.</li>
      <li>Alles läuft als JavaScript im eigenen Browser, die Eingaben erreichen also keinen Server.</li>
      <li>Einstellungen und gespeicherte Arbeit liegen in diesem Browser und lassen sich jederzeit löschen.</li>
      <li>Die gesamte Website ist quelloffen unter <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Fragen</h2>
    <dl>
      <dt>Ist Token-Generator kostenlos?</dt><dd>Ja. Token-Generator ist kostenlos nutzbar, ohne Konto, ohne Anmeldung und ohne Nutzungsgrenzen.</dd><dt>Lädt Token-Generator meine Daten hoch?</dt><dd>Nein. Es läuft vollständig im Browser, daher verlassen Texte, Dateien und Bilder niemals das Gerät.</dd><dt>Funktioniert Token-Generator offline?</dt><dd>Ja. Sobald die Seite geladen ist, arbeitet das Werkzeug ohne Verbindung weiter.</dd><dt>Wo finde ich den Quellcode?</dt><dd>Toolbox ist quelloffen unter https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Verwandte Werkzeuge</h2>
    <ul><li><a href="https://jsglobe.com/de/apps/hash-text">Text-Hash</a> - MD5-, SHA-1-, SHA-256- und SHA-512-Prüfsummen</li><li><a href="https://jsglobe.com/de/apps/hmac-generator">HMAC</a> - Schlüsselbasierte Nachrichtenauthentifizierung</li><li><a href="https://jsglobe.com/de/apps/encryption">Verschlüsseln / Entschlüsseln</a> - AES-GCM-Textverschlüsselung mit Passphrase</li><li><a href="https://jsglobe.com/de/apps/otp-generator">TOTP</a> - Zeitbasierte Einmalpasswörter aus einem Secret</li><li><a href="https://jsglobe.com/de/apps/basic-auth">Basic Auth</a> - Authorization-Header aus Zugangsdaten erzeugen</li><li><a href="https://jsglobe.com/de/apps/rsa-keygen">Schlüsselpaar</a> - RSA- und Elliptische-Kurven-Schlüssel als PEM erzeugen</li><li><a href="https://jsglobe.com/de/apps/password-strength">Passwortstärke</a> - Entropie, Schwachstellen und Knackdauer</li><li><a href="https://jsglobe.com/de/apps/cert-decoder">Zertifikat-Decoder</a> - X.509-Zertifikate und Signieranfragen lesen</li></ul>
