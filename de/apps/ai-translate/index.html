    <h1>Übersetzen</h1>
    <p>Text mit einem Modell auf diesem Gerät übersetzen. Dieses Werkzeug läuft vollständig im Browser: Nichts, was eingefügt oder geöffnet wird, verlässt das Gerät.</p>
    <h2>Was Übersetzen macht</h2>
    <p>Übersetzen gehört zum Bereich Lokale KI von Toolbox und steht dort neben 4 verwandten Werkzeugen. Es öffnet sich sofort unter https://jsglobe.com/de/apps/ai-translate, arbeitet nach dem Laden auch offline weiter und speichert alles in diesem Browser statt auf einem Server.</p>
    <p>Ebenfalls nützlich für: translate, language, ai, localise, localize, spanish, french, japanese.</p>
    <h2>So funktioniert es</h2>
    <ul>
      <li>Seite öffnen und loslegen. Kein Konto, keine Anmeldung, keine Bezahlschranke.</li>
      <li>Alles läuft als JavaScript im eigenen Browser, die Eingaben erreichen also keinen Server.</li>
      <li>Einstellungen und gespeicherte Arbeit liegen in diesem Browser und lassen sich jederzeit löschen.</li>
      <li>Die gesamte Website ist quelloffen unter <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Fragen</h2>
    <dl>
      <dt>Ist Übersetzen kostenlos?</dt><dd>Ja. Übersetzen ist kostenlos nutzbar, ohne Konto, ohne Anmeldung und ohne Nutzungsgrenzen.</dd><dt>Lädt Übersetzen meine Daten hoch?</dt><dd>Nein. Es läuft vollständig im Browser, daher verlassen Texte, Dateien und Bilder niemals das Gerät.</dd><dt>Funktioniert Übersetzen offline?</dt><dd>Ja. Sobald die Seite geladen ist, arbeitet das Werkzeug ohne Verbindung weiter.</dd><dt>Wo finde ich den Quellcode?</dt><dd>Toolbox ist quelloffen unter https://github.com/samalstudios/jsglobe.</dd>
    </dl>
