    <h1>MIDI-Keyboard</h1>
    <p>Spielbarer Synthesizer mit Computertastatur und MIDI-Eingang. Dieses Werkzeug läuft vollständig im Browser: Nichts, was eingefügt oder geöffnet wird, verlässt das Gerät.</p>
    <h2>Was MIDI-Keyboard macht</h2>
    <p>MIDI-Keyboard gehört zum Bereich Spiele von Toolbox und steht dort neben 8 verwandten Werkzeugen. Es öffnet sich sofort unter https://jsglobe.com/de/apps/midi-keyboard, arbeitet nach dem Laden auch offline weiter und speichert alles in diesem Browser statt auf einem Server.</p>
    <p>Ebenfalls nützlich für: midi, piano, keyboard, synth, music, notes, audio.</p>
    <h2>So funktioniert es</h2>
    <ul>
      <li>Seite öffnen und loslegen. Kein Konto, keine Anmeldung, keine Bezahlschranke.</li>
      <li>Alles läuft als JavaScript im eigenen Browser, die Eingaben erreichen also keinen Server.</li>
      <li>Einstellungen und gespeicherte Arbeit liegen in diesem Browser und lassen sich jederzeit löschen.</li>
      <li>Die gesamte Website ist quelloffen unter <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
