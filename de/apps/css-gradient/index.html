    <h1>Verlauf-Maker</h1>
    <p>CSS-Verläufe mit ziehbaren Farbstopps bauen. Dieses Werkzeug läuft vollständig im Browser: Nichts, was eingefügt oder geöffnet wird, verlässt das Gerät.</p>
    <h2>Was Verlauf-Maker macht</h2>
    <p>Verlauf-Maker gehört zum Bereich Web von Toolbox und steht dort neben 8 verwandten Werkzeugen. Es öffnet sich sofort unter https://jsglobe.com/de/apps/css-gradient, arbeitet nach dem Laden auch offline weiter und speichert alles in diesem Browser statt auf einem Server.</p>
    <p>Ebenfalls nützlich für: css, gradient, linear, radial, conic, background, colour, color.</p>
    <h2>So funktioniert es</h2>
    <ul>
      <li>Seite öffnen und loslegen. Kein Konto, keine Anmeldung, keine Bezahlschranke.</li>
      <li>Alles läuft als JavaScript im eigenen Browser, die Eingaben erreichen also keinen Server.</li>
      <li>Einstellungen und gespeicherte Arbeit liegen in diesem Browser und lassen sich jederzeit löschen.</li>
      <li>Die gesamte Website ist quelloffen unter <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
