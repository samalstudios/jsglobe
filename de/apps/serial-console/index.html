    <h1>Serielle Konsole</h1>
    <p>Mit einem seriellen Gerät über USB sprechen. Dieses Werkzeug läuft vollständig im Browser: Nichts, was eingefügt oder geöffnet wird, verlässt das Gerät.</p>
    <h2>Was Serielle Konsole macht</h2>
    <p>Serielle Konsole gehört zum Bereich Werkzeuge von Toolbox und steht dort neben 8 verwandten Werkzeugen. Es öffnet sich sofort unter https://jsglobe.com/de/apps/serial-console, arbeitet nach dem Laden auch offline weiter und speichert alles in diesem Browser statt auf einem Server.</p>
    <p>Ebenfalls nützlich für: serial, uart, usb, tty, console, arduino, esp32, baud, rs232.</p>
    <h2>So funktioniert es</h2>
    <ul>
      <li>Seite öffnen und loslegen. Kein Konto, keine Anmeldung, keine Bezahlschranke.</li>
      <li>Alles läuft als JavaScript im eigenen Browser, die Eingaben erreichen also keinen Server.</li>
      <li>Einstellungen und gespeicherte Arbeit liegen in diesem Browser und lassen sich jederzeit löschen.</li>
      <li>Die gesamte Website ist quelloffen unter <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Fragen</h2>
    <dl>
      <dt>Ist Serielle Konsole kostenlos?</dt><dd>Ja. Serielle Konsole ist kostenlos nutzbar, ohne Konto, ohne Anmeldung und ohne Nutzungsgrenzen.</dd><dt>Lädt Serielle Konsole meine Daten hoch?</dt><dd>Nein. Es läuft vollständig im Browser, daher verlassen Texte, Dateien und Bilder niemals das Gerät.</dd><dt>Funktioniert Serielle Konsole offline?</dt><dd>Ja. Sobald die Seite geladen ist, arbeitet das Werkzeug ohne Verbindung weiter.</dd><dt>Wo finde ich den Quellcode?</dt><dd>Toolbox ist quelloffen unter https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Verwandte Werkzeuge</h2>
    <ul><li><a href="https://jsglobe.com/de/apps/uuid-generator">UUID</a> - v4- und v7-Kennungen in großer Zahl erzeugen</li><li><a href="https://jsglobe.com/de/apps/device-info">Geräteinfo</a> - Alles, was der Browser über dieses Gerät weiß</li><li><a href="https://jsglobe.com/de/apps/clock">Uhr</a> - Weltzeituhren, Stoppuhr und Countdown</li><li><a href="https://jsglobe.com/de/apps/calendar">Kalender</a> - Monatsansicht mit Terminen pro Arbeitsbereich</li><li><a href="https://jsglobe.com/de/apps/portfolio">Portfolio</a> - Bestände, Aufteilung und Gewinn oder Verlust verfolgen</li><li><a href="https://jsglobe.com/de/apps/notes">Notizen</a> - Schnelle Notizen in diesem Arbeitsbereich</li><li><a href="https://jsglobe.com/de/apps/todo">Aufgaben</a> - Eine leichte Checkliste pro Arbeitsbereich</li><li><a href="https://jsglobe.com/de/apps/timezone-planner">Zeitzonen</a> - Städte vergleichen und gemeinsame Stunden finden</li></ul>
