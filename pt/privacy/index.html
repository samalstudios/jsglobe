  <main>
    <h1>Política de privacidade</h1>
    <p>O Toolbox é um site estático. Cada ferramenta roda no seu navegador e os textos, arquivos e imagens que você usa nunca são enviados.</p>
    <h2>Cookies</h2>
    <p>O Google Analytics 4 só é carregado depois que você aceita o aviso de cookies, com anonimização de IP e sem armazenamento de publicidade ou personalização. Recusar não define nenhum cookie de analytics. Você pode mudar a escolha a qualquer momento nesta página ou nas configurações.</p>
    <h2>Dados locais</h2>
    <p>Notas, tarefas, configurações e o estado dos apps ficam no armazenamento local e no IndexedDB deste navegador, e podem ser apagados nas configurações, em Dados. Não há contas nem coleta de e-mails.</p>
    <h2>Terceiros</h2>
    <p>Algumas ferramentas chamam um serviço público apenas quando você pede, como resolvedores DNS para consultas, a Cloudflare para o teste de velocidade, a CoinGecko e um conjunto aberto de taxas de câmbio para os preços da carteira, e CDNs públicos para modelos de IA e codecs de mídia.</p>
    <h2>Código-fonte</h2>
    <p>O site é de código aberto em <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</p>
    <p><a href="https://jsglobe.com/pt/apps">Percorrer as 129 ferramentas</a></p>
