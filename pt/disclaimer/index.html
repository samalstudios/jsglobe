    <h1>Aviso legal</h1>
    <p>As ferramentas do Toolbox são modelos simplificados, conferidos com exemplos resolvidos mas que deixam coisas de fora. Trate cada resultado como um ponto de partida a confirmar.</p>
    <h2>Não é orientação profissional</h2>
    <p>Nada aqui é orientação jurídica, tributária, financeira, médica ou de engenharia, e usar isto não cria nenhuma relação profissional. Para qualquer coisa que tenha consequência real, procure alguém qualificado que conheça a sua situação.</p>
    <h2>Dados de outros lugares</h2>
    <p>Algumas ferramentas buscam dados em serviços públicos quando você pede, como taxas de câmbio, cotações e consultas de domínio. Esses dados pertencem a esses serviços, podem estar atrasados ou errados, e são repassados como chegam, sem qualquer verificação.</p>
    <h2>Oferecidas como estão</h2>
    <p>Estas ferramentas vêm sem garantia de nenhum tipo. Podem conter erros, ficar indisponíveis, mudar ou desaparecer. Na medida em que a lei permitir, nenhuma responsabilidade é assumida por perdas decorrentes do uso delas ou da confiança no que produzem.</p>
    <h2>Leia o código</h2>
    <p>O site é de código aberto, então você pode conferir exatamente o que cada ferramenta faz em vez de acreditar na palavra dela. Erros valem ser relatados.</p>
