    <h1>Força da senha</h1>
    <p>Entropia, fraquezas e tempo até ser quebrada. Esta ferramenta roda inteiramente no seu navegador: nada do que você cola ou abre sai do seu dispositivo.</p>
    <h2>O que o Força da senha faz</h2>
    <p>O Força da senha fica na seção Criptografia e segurança do Toolbox, ao lado de 8 ferramentas relacionadas. Abre na hora em https://jsglobe.com/pt/apps/password-strength, continua funcionando offline depois que a página carrega, e guarda o que você salvar neste navegador em vez de num servidor.</p>
    <p>Também útil para: password, strength, entropy, crack, secure.</p>
    <h2>Como funciona</h2>
    <ul>
      <li>Abra a página e comece a usar. Não há conta, nem cadastro, nem paywall.</li>
      <li>Tudo roda como JavaScript no seu próprio navegador, então o que você digita nunca chega a um servidor.</li>
      <li>Configurações e trabalho salvo ficam neste navegador e podem ser apagados a qualquer momento.</li>
      <li>O site inteiro é de código aberto em <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Perguntas</h2>
    <dl>
      <dt>O Força da senha é gratuito?</dt><dd>Sim. O Força da senha é de uso gratuito, sem conta, sem cadastro e sem limites de uso.</dd><dt>O Força da senha envia os meus dados?</dt><dd>Não. Ele roda inteiramente no seu navegador, então os textos, arquivos e imagens que você fornece nunca saem do seu dispositivo.</dd><dt>O Força da senha funciona offline?</dt><dd>Sim. Depois que a página carrega, a ferramenta continua funcionando sem conexão.</dd><dt>Onde encontro o código-fonte?</dt><dd>O Toolbox é de código aberto em https://github.com/samalstudios/jsglobe.</dd>
    </dl>
