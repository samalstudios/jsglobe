    <p>Dig style record lookups over DNS-over-HTTPS. Esta ferramenta roda inteiramente no seu navegador: nada do que você cola ou abre sai do seu dispositivo.</p>
    <h2>O que o DNS Lookup faz</h2>
    <p>O DNS Lookup fica na seção Rede do Toolbox, ao lado de 6 ferramentas relacionadas. Abre na hora em https://jsglobe.com/pt/apps/dns-lookup, continua funcionando offline depois que a página carrega, e guarda o que você salvar neste navegador em vez de num servidor.</p>
    <p>Também útil para: dns, dig, nslookup, records, mx, txt, ns, ptr, domain.</p>
    <h2>Como funciona</h2>
    <ul>
      <li>Abra a página e comece a usar. Não há conta, nem cadastro, nem paywall.</li>
      <li>Tudo roda como JavaScript no seu próprio navegador, então o que você digita nunca chega a um servidor.</li>
      <li>Configurações e trabalho salvo ficam neste navegador e podem ser apagados a qualquer momento.</li>
      <li>O site inteiro é de código aberto em <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
