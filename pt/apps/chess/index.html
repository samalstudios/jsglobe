    <h1>Xadrez</h1>
    <p>Jogue contra o computador, aprenda aberturas e treine táticas. Esta ferramenta roda inteiramente no seu navegador: nada do que você cola ou abre sai do seu dispositivo.</p>
    <h2>O que o Xadrez faz</h2>
    <p>O Xadrez fica na seção Jogos do Toolbox, ao lado de 8 ferramentas relacionadas. Abre na hora em https://jsglobe.com/pt/apps/chess, continua funcionando offline depois que a página carrega, e guarda o que você salvar neste navegador em vez de num servidor.</p>
    <p>Também útil para: chess, board, openings, tactics, puzzle, engine, training.</p>
    <h2>Como funciona</h2>
    <ul>
      <li>Abra a página e comece a usar. Não há conta, nem cadastro, nem paywall.</li>
      <li>Tudo roda como JavaScript no seu próprio navegador, então o que você digita nunca chega a um servidor.</li>
      <li>Configurações e trabalho salvo ficam neste navegador e podem ser apagados a qualquer momento.</li>
      <li>O site inteiro é de código aberto em <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Perguntas</h2>
