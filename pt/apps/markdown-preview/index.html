    <h1>Markdown</h1>
    <p>Escreva markdown e veja o HTML. Esta ferramenta roda inteiramente no seu navegador: nada do que você cola ou abre sai do seu dispositivo.</p>
    <h2>O que o Markdown faz</h2>
    <p>O Markdown fica na seção Texto do Toolbox, ao lado de 7 ferramentas relacionadas. Abre na hora em https://jsglobe.com/pt/apps/markdown-preview, continua funcionando offline depois que a página carrega, e guarda o que você salvar neste navegador em vez de num servidor.</p>
    <p>Também útil para: markdown, md, preview, html, render.</p>
    <h2>Como funciona</h2>
    <ul>
      <li>Abra a página e comece a usar. Não há conta, nem cadastro, nem paywall.</li>
      <li>Tudo roda como JavaScript no seu próprio navegador, então o que você digita nunca chega a um servidor.</li>
      <li>Configurações e trabalho salvo ficam neste navegador e podem ser apagados a qualquer momento.</li>
      <li>O site inteiro é de código aberto em <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Perguntas</h2>
    <dl>
      <dt>O Markdown é gratuito?</dt><dd>Sim. O Markdown é de uso gratuito, sem conta, sem cadastro e sem limites de uso.</dd><dt>O Markdown envia os meus dados?</dt><dd>Não. Ele roda inteiramente no seu navegador, então os textos, arquivos e imagens que você fornece nunca saem do seu dispositivo.</dd><dt>O Markdown funciona offline?</dt><dd>Sim. Depois que a página carrega, a ferramenta continua funcionando sem conexão.</dd><dt>Onde encontro o código-fonte?</dt><dd>O Toolbox é de código aberto em https://github.com/samalstudios/jsglobe.</dd>
    </dl>
