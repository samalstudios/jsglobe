    <h1>Avertissement</h1>
    <p>Les outils de Toolbox sont des modèles simplifiés, vérifiés sur des exemples calculés mais qui laissent des choses de côté. Traitez chaque résultat comme un point de départ à confirmer.</p>
    <h2>Pas un conseil professionnel</h2>
    <p>Rien ici ne constitue un conseil juridique, fiscal, financier, médical ou technique, et l'usage de ces outils ne crée aucune relation professionnelle. Pour tout ce qui porte à conséquence, adressez-vous à une personne qualifiée qui connaît votre situation.</p>
    <h2>Données venues d'ailleurs</h2>
    <p>Certains outils récupèrent des données auprès de services publics lorsque vous le demandez, comme les taux de change, les cours et les recherches de domaines. Ces données appartiennent à ces services, peuvent être différées ou fausses, et sont transmises telles quelles sans vérification.</p>
    <h2>Fournis tels quels</h2>
    <p>Ces outils sont fournis sans garantie d'aucune sorte. Ils peuvent comporter des erreurs, être indisponibles, changer ou disparaître. Dans la mesure permise par la loi, aucune responsabilité n'est acceptée pour une perte découlant de leur usage ou de la confiance accordée à leurs résultats.</p>
    <h2>Lire le code</h2>
    <p>Le site est open source, vous pouvez donc vérifier exactement ce que fait chaque outil plutôt que de le croire sur parole. Les erreurs méritent d'être signalées.</p>
