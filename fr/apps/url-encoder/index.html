    <h1>Encodage d'URL</h1>
    <p>Encoder et décoder en pourcentage les composants d'URL. Cet outil tourne entièrement dans votre navigateur : rien de ce que vous collez ou ouvrez ne quitte votre appareil.</p>
    <h2>Ce que fait Encodage d'URL</h2>
    <p>Encodage d'URL appartient à la section Web de Toolbox, aux côtés de 8 outils voisins. Il s'ouvre aussitôt à l'adresse https://jsglobe.com/fr/apps/url-encoder, continue de fonctionner hors ligne une fois la page chargée, et garde tout ce que vous enregistrez dans ce navigateur plutôt que sur un serveur.</p>
    <p>Également utile pour : url, encode, decode, percent, uri.</p>
    <h2>Comment ça marche</h2>
    <ul>
      <li>Ouvrez la page et servez-vous. Pas de compte, pas d'inscription, pas de paiement.</li>
      <li>Tout tourne en JavaScript dans votre propre navigateur, vos saisies n'atteignent donc jamais un serveur.</li>
      <li>Les réglages et le travail enregistré vivent dans ce navigateur et peuvent être effacés à tout moment.</li>
      <li>L'ensemble du site est open source sur <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Questions</h2>
    <dl>
      <dt>Encodage d'URL est-il gratuit ?</dt><dd>Oui. Encodage d'URL s'utilise gratuitement, sans compte, sans inscription et sans limite d'usage.</dd><dt>Encodage d'URL envoie-t-il mes données ?</dt><dd>Non. Tout tourne dans votre navigateur, donc les textes, fichiers et images que vous lui confiez ne quittent jamais votre appareil.</dd><dt>Encodage d'URL fonctionne-t-il hors ligne ?</dt><dd>Oui. Une fois la page chargée, l'outil continue de fonctionner sans connexion.</dd><dt>Où trouver le code source ?</dt><dd>Toolbox est open source sur https://github.com/samalstudios/jsglobe.</dd>
    </dl>
