    <p>Stats de texte appartient à la section Texte de Toolbox, aux côtés de 7 outils voisins. Il s'ouvre aussitôt à l'adresse https://jsglobe.com/fr/apps/text-stats, continue de fonctionner hors ligne une fois la page chargée, et garde tout ce que vous enregistrez dans ce navigateur plutôt que sur un serveur.</p>
    <p>Également utile pour : text, stats, count, words, characters, reading.</p>
    <h2>Comment ça marche</h2>
    <ul>
