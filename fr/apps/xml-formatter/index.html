    <h1>Formateur XML</h1>
    <p>Indenter et minifier du balisage XML ou HTML. Cet outil tourne entièrement dans votre navigateur : rien de ce que vous collez ou ouvrez ne quitte votre appareil.</p>
    <h2>Ce que fait Formateur XML</h2>
    <p>Formateur XML appartient à la section Développement de Toolbox, aux côtés de 8 outils voisins. Il s'ouvre aussitôt à l'adresse https://jsglobe.com/fr/apps/xml-formatter, continue de fonctionner hors ligne une fois la page chargée, et garde tout ce que vous enregistrez dans ce navigateur plutôt que sur un serveur.</p>
    <p>Également utile pour : xml, html, format, pretty, indent.</p>
    <h2>Comment ça marche</h2>
    <ul>
      <li>Ouvrez la page et servez-vous. Pas de compte, pas d'inscription, pas de paiement.</li>
      <li>Tout tourne en JavaScript dans votre propre navigateur, vos saisies n'atteignent donc jamais un serveur.</li>
      <li>Les réglages et le travail enregistré vivent dans ce navigateur et peuvent être effacés à tout moment.</li>
      <li>L'ensemble du site est open source sur <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
