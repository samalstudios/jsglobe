  <main>
    <h1>Politique de confidentialité</h1>
    <p>Toolbox est un site statique. Chaque outil tourne dans votre navigateur et les textes, fichiers et images que vous utilisez ne sont jamais envoyés.</p>
    <h2>Cookies</h2>
    <p>Google Analytics 4 n'est chargé qu'après acceptation de la bannière de cookies, avec anonymisation de l'IP et sans stockage publicitaire ni de personnalisation. Un refus ne pose aucun cookie d'analytics. Vous pouvez changer ce choix à tout moment sur cette page ou dans les réglages.</p>
    <h2>Données locales</h2>
    <p>Les notes, tâches, réglages et l'état des apps sont conservés dans le stockage local et l'IndexedDB de ce navigateur, et peuvent être effacés depuis les réglages, section Données. Il n'y a ni comptes ni collecte d'e-mails.</p>
    <h2>Tiers</h2>
    <p>Certains outils appellent un service public uniquement à votre demande : résolveurs DNS pour les recherches, Cloudflare pour le test de débit, CoinGecko et un jeu de données ouvert de taux de change pour les cours du portefeuille, et des CDN publics pour les modèles d'IA et les codecs.</p>
    <h2>Code source</h2>
    <p>Le site est open source sur <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</p>
    <p><a href="https://jsglobe.com/fr/apps">Parcourir les 129 outils</a></p>
