    <h1>Política de privacidad</h1>
    <p>Toolbox es un sitio estático. Cada herramienta funciona en tu navegador y el texto, los archivos y las imágenes que uses nunca se suben.</p>
    <h2>Cookies</h2>
    <p>Google Analytics 4 solo se carga después de que aceptes el aviso de cookies, con anonimización de IP y sin almacenamiento publicitario ni de personalización. Si lo rechazas no se instala ninguna cookie de analítica. Puedes cambiar tu decisión cuando quieras en esta página o en Ajustes.</p>
    <h2>Datos locales</h2>
    <p>Las notas, tareas, ajustes y el estado de las apps se guardan en el almacenamiento local e IndexedDB de este navegador, y puedes borrarlos desde Ajustes, en Datos. No hay cuentas ni recogida de correos.</p>
    <h2>Terceros</h2>
    <p>Algunas herramientas llaman a un servicio público solo cuando se lo pides, como los resolutores DNS para las consultas, Cloudflare para el test de velocidad, CoinGecko y un conjunto abierto de tipos de cambio para los precios de la cartera, y CDN públicas para los modelos de IA y los códecs multimedia.</p>
    <h2>Código fuente</h2>
    <p>El sitio es de código abierto en <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</p>
    <p><a href="https://jsglobe.com/es/apps">Ver las 118 herramientas</a></p>
