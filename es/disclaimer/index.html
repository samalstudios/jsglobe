    <p>Nada de este sitio es asesoramiento jurídico, fiscal, financiero, médico ni de ingeniería, y usarlo no crea ninguna relación profesional. Para cualquier cosa con consecuencias reales, consulta a alguien cualificado que conozca tu situación.</p>
    <h2>Datos de terceros</h2>
    <p>Algunas herramientas piden datos a servicios públicos cuando tú lo solicitas, como tipos de cambio, precios y consultas de dominios. Esos datos pertenecen a dichos servicios, pueden llegar con retraso o ser erróneos, y se muestran tal cual sin comprobación alguna.</p>
