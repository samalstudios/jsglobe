    <p>Laboratorio de lógica está en la sección Ciencia de Toolbox, junto a otras 5 herramientas relacionadas. Se abre al instante en https://jsglobe.com/es/apps/logic-lab, sigue funcionando sin conexión una vez cargada la página y guarda tu trabajo en este navegador en lugar de en un servidor.</p>
    <p>También útil para: logic, digital, gate, and, or, xor, flip-flop, counter, seven segment, led matrix, decoder, multiplexer, boolean, circuit.</p>

      <li>Todo se ejecuta como JavaScript en tu propio navegador, así que lo que escribes nunca llega a un servidor.</li>
