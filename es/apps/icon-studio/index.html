    <h1>Estudio de iconos</h1>
    <p>Crea un icono con miles de piezas, o descríbelo. Esta herramienta funciona enteramente en tu navegador: nada de lo que pegues o abras sale de tu dispositivo.</p>
    <h2>Qué hace Estudio de iconos</h2>
    <p>Estudio de iconos está en la sección Multimedia de Toolbox, junto a otras 8 herramientas relacionadas. Se abre al instante en https://jsglobe.com/es/apps/icon-studio, sigue funcionando sin conexión una vez cargada la página y guarda tu trabajo en este navegador en lugar de en un servidor.</p>
    <p>También útil para: icon, svg, logo, symbol, design, generator, mark, favicon.</p>
    <h2>Cómo funciona</h2>
    <ul>
      <li>Abre la página y empieza a usarla. Sin cuenta, sin registro y sin muro de pago.</li>
      <li>Todo se ejecuta como JavaScript en tu propio navegador, así que lo que escribes nunca llega a un servidor.</li>
      <li>Los ajustes y el trabajo guardado viven en este navegador y puedes borrarlos cuando quieras.</li>
      <li>Todo el sitio es de código abierto en <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
