    <h1>TOTP</h1>
    <p>Contraseñas de un solo uso basadas en tiempo. Esta herramienta funciona enteramente en tu navegador: nada de lo que pegues o abras sale de tu dispositivo.</p>
    <h2>Qué hace TOTP</h2>
    <p>TOTP está en la sección Cripto y seguridad de Toolbox, junto a otras 8 herramientas relacionadas. Se abre al instante en https://jsglobe.com/es/apps/otp-generator, sigue funcionando sin conexión una vez cargada la página y guarda tu trabajo en este navegador en lugar de en un servidor.</p>
    <p>También útil para: otp, totp, 2fa, mfa, authenticator.</p>
    <h2>Cómo funciona</h2>
    <ul>
      <li>Abre la página y empieza a usarla. Sin cuenta, sin registro y sin muro de pago.</li>
      <li>Todo se ejecuta como JavaScript en tu propio navegador, así que lo que escribes nunca llega a un servidor.</li>
      <li>Los ajustes y el trabajo guardado viven en este navegador y puedes borrarlos cuando quieras.</li>
      <li>Todo el sitio es de código abierto en <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Preguntas</h2>
    <dl>
      <dt>¿TOTP es gratis?</dt><dd>Sí. TOTP es de uso gratuito, sin cuenta, sin registro y sin límites de uso.</dd><dt>¿TOTP sube mis datos?</dt><dd>No. Funciona enteramente en tu navegador, así que el texto, los archivos y las imágenes que le des nunca salen de tu dispositivo.</dd><dt>¿TOTP funciona sin conexión?</dt><dd>Sí. Una vez cargada la página, la herramienta sigue funcionando sin conexión.</dd><dt>¿Dónde está el código fuente?</dt><dd>Toolbox es de código abierto en https://github.com/samalstudios/jsglobe.</dd>
    </dl>
