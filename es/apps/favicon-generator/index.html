    <p>Creador de favicon está en la sección Multimedia de Toolbox, junto a otras 8 herramientas relacionadas. Se abre al instante en https://jsglobe.com/es/apps/favicon-generator, sigue funcionando sin conexión una vez cargada la página y guarda tu trabajo en este navegador en lugar de en un servidor.</p>
    <p>También útil para: favicon, icon, ico, apple touch, manifest, pwa, app icon.</p>
    <h2>Cómo funciona</h2>
    <ul>
      <li>Abre la página y empieza a usarla. Sin cuenta, sin registro y sin muro de pago.</li>
      <li>Todo se ejecuta como JavaScript en tu propio navegador, así que lo que escribes nunca llega a un servidor.</li>
      <li>Los ajustes y el trabajo guardado viven en este navegador y puedes borrarlos cuando quieras.</li>
