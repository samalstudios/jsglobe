    <h1>Przegląd nagłówków</h1>
    <p>Oceń nagłówki odpowiedzi pod kątem bezpieczeństwa i prywatności. To narzędzie działa w całości w twojej przeglądarce: nic, co wklejasz lub otwierasz, nie opuszcza urządzenia.</p>
    <h2>Co robi Przegląd nagłówków</h2>
    <p>Przegląd nagłówków należy do działu Sieć w Toolbox i stoi tam obok pokrewnych narzędzi (8). Otwiera się od razu pod adresem https://jsglobe.com/pl/apps/http-headers, działa dalej bez połączenia po wczytaniu strony, a to, co zapiszesz, zostaje w tej przeglądarce, a nie na serwerze.</p>
    <p>Przydaje się też do: http, headers, security, csp, hsts, cookies, audit, response.</p>
    <h2>Jak to działa</h2>
    <ul>
      <li>Otwórz stronę i zaczynaj. Bez konta, bez rejestracji, bez opłat.</li>
      <li>Wszystko działa jako JavaScript w twojej własnej przeglądarce, więc to, co wpisujesz, nigdy nie trafia na serwer.</li>
      <li>Ustawienia i zapisana praca są w tej przeglądarce i można je w każdej chwili usunąć.</li>
      <li>Cała strona ma otwarty kod pod adresem <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Pytania</h2>
    <dl>
      <dt>Czy Przegląd nagłówków jest darmowe?</dt><dd>Tak. Przegląd nagłówków można używać za darmo, bez konta, bez rejestracji i bez limitów.</dd><dt>Czy Przegląd nagłówków wysyła moje dane?</dt><dd>Nie. Działa w całości w twojej przeglądarce, więc teksty, pliki i obrazy, które mu podasz, nigdy nie opuszczają urządzenia.</dd><dt>Czy Przegląd nagłówków działa bez internetu?</dt><dd>Tak. Po wczytaniu strony narzędzie działa dalej bez połączenia.</dd><dt>Gdzie znajdę kod źródłowy?</dt><dd>Toolbox ma otwarty kod pod adresem https://github.com/samalstudios/jsglobe.</dd>
    </dl>
