    <h1>Metadane Exif</h1>
    <p>Czytaj i usuwaj metadane ze zdjęć JPEG. To narzędzie działa w całości w twojej przeglądarce: nic, co wklejasz lub otwierasz, nie opuszcza urządzenia.</p>
    <h2>Co robi Metadane Exif</h2>
    <p>Metadane Exif należy do działu Multimedia w Toolbox i stoi tam obok pokrewnych narzędzi (8). Otwiera się od razu pod adresem https://jsglobe.com/pl/apps/exif-editor, działa dalej bez połączenia po wczytaniu strony, a to, co zapiszesz, zostaje w tej przeglądarce, a nie na serwerze.</p>
    <p>Przydaje się też do: exif, metadata, photo, jpeg, gps, privacy, strip.</p>
    <h2>Jak to działa</h2>
    <ul>
      <li>Otwórz stronę i zaczynaj. Bez konta, bez rejestracji, bez opłat.</li>
      <li>Wszystko działa jako JavaScript w twojej własnej przeglądarce, więc to, co wpisujesz, nigdy nie trafia na serwer.</li>
      <li>Ustawienia i zapisana praca są w tej przeglądarce i można je w każdej chwili usunąć.</li>
      <li>Cała strona ma otwarty kod pod adresem <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Pytania</h2>
    <dl>
      <dt>Czy Metadane Exif jest darmowe?</dt><dd>Tak. Metadane Exif można używać za darmo, bez konta, bez rejestracji i bez limitów.</dd><dt>Czy Metadane Exif wysyła moje dane?</dt><dd>Nie. Działa w całości w twojej przeglądarce, więc teksty, pliki i obrazy, które mu podasz, nigdy nie opuszczają urządzenia.</dd><dt>Czy Metadane Exif działa bez internetu?</dt><dd>Tak. Po wczytaniu strony narzędzie działa dalej bez połączenia.</dd><dt>Gdzie znajdę kod źródłowy?</dt><dd>Toolbox ma otwarty kod pod adresem https://github.com/samalstudios/jsglobe.</dd>
    </dl>
