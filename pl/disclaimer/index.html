    <h1>Zastrzeżenia</h1>
    <p>Narzędzia w Toolbox to uproszczone modele, sprawdzone na przeliczonych przykładach, ale pomijające różne rzeczy. Każdy wynik traktuj jako punkt wyjścia do potwierdzenia.</p>
    <h2>To nie jest porada zawodowa</h2>
    <p>Nic tutaj nie jest poradą prawną, podatkową, finansową, medyczną ani inżynierską, a korzystanie z tego nie tworzy żadnej relacji zawodowej. W sprawach o realnych skutkach zapytaj kogoś z odpowiednią wiedzą, kto zna twoją sytuację.</p>
    <h2>Dane z zewnątrz</h2>
    <p>Niektóre narzędzia pobierają dane z publicznych serwisów, gdy o to poprosisz: kursy walut, ceny czy dane o domenach. Te dane należą do tych serwisów, mogą być opóźnione lub błędne i są przekazywane dalej w takiej postaci, w jakiej przyszły, bez sprawdzania.</p>
    <h2>Udostępniane w takiej postaci, w jakiej są</h2>
    <p>Te narzędzia są udostępniane bez jakiejkolwiek gwarancji. Mogą zawierać błędy, bywać niedostępne, zmieniać się lub zniknąć. W zakresie dozwolonym przez prawo nie ponosimy odpowiedzialności za szkody wynikłe z korzystania z nich ani z polegania na tym, co dają.</p>
    <h2>Przeczytaj kod</h2>
    <p>Strona ma otwarty kod, więc możesz sprawdzić dokładnie, co robi każde narzędzie, zamiast wierzyć mu na słowo. Błędy warto zgłaszać.</p>
