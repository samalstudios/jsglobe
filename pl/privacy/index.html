  <main>
    <h1>Polityka prywatności</h1>
    <p>Toolbox to statyczna strona. Każde narzędzie działa w twojej przeglądarce, a używane teksty, pliki i obrazy nigdy nie są wysyłane.</p>
    <h2>Ciasteczka</h2>
    <p>Google Analytics 4 wczytuje się dopiero po zaakceptowaniu komunikatu o ciasteczkach, z anonimizacją IP i bez pamięci na reklamy czy personalizację. Odmowa nie ustawia żadnych ciasteczek analitycznych. Wybór można zmienić w każdej chwili na tej stronie lub w ustawieniach.</p>
    <h2>Dane lokalne</h2>
    <p>Notatki, zadania, ustawienia i stan aplikacji są w local storage i IndexedDB tej przeglądarki i można je usunąć w ustawieniach, w sekcji Dane. Nie ma kont ani zbierania adresów e-mail.</p>
    <h2>Podmioty zewnętrzne</h2>
    <p>Niektóre narzędzia odpytują publiczny serwis tylko wtedy, gdy o to poprosisz: resolwery DNS przy zapytaniach, Cloudflare przy teście prędkości, CoinGecko i otwarty zbiór kursów walut przy wycenie portfela oraz publiczne CDN-y dla modeli SI i kodeków multimedialnych.</p>
    <h2>Kod źródłowy</h2>
    <p>Strona ma otwarty kod pod adresem <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</p>
