    <h1>SVG Studio</h1>
    <p>View, clean, recolour and export SVG. This tool runs entirely in your browser: nothing you paste or upload leaves your device.</p>
    <h2>What SVG Studio does</h2>
    <p>SVG Studio sits in the Media section of Toolbox, alongside 8 related tools. It opens instantly at https://jsglobe.com/apps/svg-editor, keeps working offline once the page has loaded, and stores anything you save in this browser rather than on a server.</p>
    <p>Also useful for: svg, vector, viewer, editor, optimise, optimize, icon, minify, png.</p>
    <h2>How it works</h2>
    <ul>
      <li>Open the page and start using it. There is no account, no sign up and no paywall.</li>
      <li>Everything runs as JavaScript in your own browser, so your input never reaches a server.</li>
      <li>Settings and saved work live in this browser and can be cleared at any time.</li>
      <li>The whole site is open source at <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
