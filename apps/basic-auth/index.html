    <h1>Basic Auth</h1>
    <p>Build Authorization headers from credentials. This tool runs entirely in your browser: nothing you paste or upload leaves your device.</p>
    <h2>What Basic Auth does</h2>
    <p>Basic Auth sits in the Crypto &amp; Security section of Toolbox, alongside 8 related tools. It opens instantly at <code>https://jsglobe.com/apps/basic-auth</code>, keeps working offline once the page has loaded, and stores anything you save in this browser rather than on a server.</p>
    <p>Also useful for: basic, auth, header, authorization, base64.</p>
    <h2>How it works</h2>
    <ul>
      <li>Open the page and start using it. There is no account, no sign up and no paywall.</li>
      <li>Everything runs as JavaScript in your own browser, so your input never reaches a server.</li>
      <li>Settings and saved work live in this browser and can be cleared at any time.</li>
      <li>The whole site is open source at <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Questions</h2>
