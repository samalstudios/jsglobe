    <h1>API Spec Editor</h1>
    <p>Edit and check OpenAPI documents. This tool runs entirely in your browser: nothing you paste or upload leaves your device.</p>
    <h2>What API Spec Editor does</h2>
    <p>API Spec Editor sits in the Development section of Toolbox, alongside 8 related tools. It opens instantly at <code>https://jsglobe.com/apps/api-spec</code>, keeps working offline once the page has loaded, and stores anything you save in this browser rather than on a server.</p>
    <p>Also useful for: openapi, swagger, api, spec, rest, yaml, schema, lint.</p>
    <h2>How it works</h2>
    <ul>
      <li>Open the page and start using it. There is no account, no sign up and no paywall.</li>
      <li>Everything runs as JavaScript in your own browser, so your input never reaches a server.</li>
      <li>Settings and saved work live in this browser and can be cleared at any time.</li>
      <li>The whole site is open source at <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Questions</h2>
    <dl>
      <dt>Is API Spec Editor free?</dt><dd>Yes. API Spec Editor is free to use, with no account, no sign up and no usage limits.</dd><dt>Does API Spec Editor upload my data?</dt><dd>No. It runs entirely in your browser, so the text, files and images you give it never leave your device.</dd><dt>Does API Spec Editor work offline?</dt><dd>Yes. Once the page has loaded, the tool keeps working without a connection.</dd><dt>Where can I find the source?</dt><dd>Toolbox is open source at https://github.com/samalstudios/jsglobe.</dd>
    </dl>
