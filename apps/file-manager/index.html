    <h1>File Manager</h1>
    
    <p>Open a folder on your computer to browse, preview, edit and organise its files. This tool runs entirely in your browser: nothing you paste or upload leaves your device.</p>
    <h2>What File Manager does</h2>
    <p>File Manager sits in the Utility section of Toolbox, alongside 8 related tools. It opens instantly at https://jsglobe.com/apps/file-manager, keeps working offline once the page has loaded, and stores anything you save in this browser rather than on a server.</p>
    <p>Also useful for: file manager, file explorer, file browser, finder, open folder, local files, rename files, preview files, text editor, file system access.</p>
    <h2>How it works</h2>
    <ul>
      <li>Open the page and start using it. There is no account, no sign up and no paywall.</li>
      <li>Everything runs as JavaScript in your own browser, so your input never reaches a server.</li>
      <li>Settings and saved work live in this browser and can be cleared at any time.</li>
      <li>The whole site is open source at <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Questions</h2>
    <dl>
      <dt>Is File Manager free?</dt><dd>Yes. File Manager is free to use, with no account, no sign up and no usage limits.</dd><dt>Does File Manager upload my data?</dt><dd>No. It runs entirely in your browser, so the text, files and images you give it never leave your device.</dd><dt>Does File Manager work offline?</dt><dd>Yes. Once the page has loaded, the tool keeps working without a connection.</dd><dt>Where can I find the source?</dt><dd>Toolbox is open source at https://github.com/samalstudios/jsglobe.</dd>
    </dl>
