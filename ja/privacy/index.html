  <main>
    <h1>プライバシーポリシー</h1>
    <p>Toolbox は静的サイトです。どのツールもブラウザで動き、使ったテキスト、ファイル、画像がアップロードされることはありません。</p>
    <h2>Cookie</h2>
    <p>Google Analytics 4 は Cookie バナーに同意した後にのみ読み込まれ、IP は匿名化され、広告やパーソナライズ用の保存は行いません。拒否した場合、分析 Cookie は設定されません。この選択はこのページか設定でいつでも変更できます。</p>
    <h2>ローカルのデータ</h2>
    <p>メモ、タスク、設定、アプリの状態は、このブラウザのローカルストレージと IndexedDB に保存され、設定のデータから消せます。アカウントもメールアドレスの収集もありません。</p>
    <h2>第三者</h2>
    <p>一部のツールは、求めたときにだけ公開サービスを呼び出します。照会のための DNS リゾルバ、速度測定のための Cloudflare、ポートフォリオの価格のための CoinGecko と公開されている為替データ、AI モデルとメディアコーデックのための公開 CDN などです。</p>
    <h2>ソースコード</h2>
    <p>このサイトは <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a> でオープンソースです。</p>
    <p><a href="https://jsglobe.com/ja/apps">129 個のツールをすべて見る</a></p>
