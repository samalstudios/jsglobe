    <p>並べ替え、重複除去、囲み、結合。このツールはすべてブラウザで動きます。貼り付けたものも開いたものも、端末から出ることはありません。</p>
    <h2>リスト変換 でできること</h2>
    <p>リスト変換 は Toolbox の変換ツールセクションにあり、関連する 8 個のツールと並んでいます。https://jsglobe.com/ja/apps/list-converter ですぐに開き、ページを読み込んだ後はオフラインでも動き、保存したものはサーバーではなくこのブラウザに残ります。</p>
    <p>こんな用途にも: list, sort, dedupe, join, split, lines, csv。</p>

      <li>設定と保存した内容はこのブラウザにあり、いつでも消せます。</li>
      <li>サイト全体が <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a> でオープンソースです。</li>
    </ul>
