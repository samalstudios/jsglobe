    <h1>SSH 鍵</h1>
    <p>OpenSSH 鍵をオフラインで生成、検査。このツールはすべてブラウザで動きます。貼り付けたものも開いたものも、端末から出ることはありません。</p>
    <h2>SSH 鍵 でできること</h2>
    <p>SSH 鍵 は Toolbox の暗号とセキュリティセクションにあり、関連する 8 個のツールと並んでいます。https://jsglobe.com/ja/apps/ssh-keys ですぐに開き、ページを読み込んだ後はオフラインでも動き、保存したものはサーバーではなくこのブラウザに残ります。</p>
    <p>こんな用途にも: ssh, key, ed25519, rsa, ecdsa, keygen, fingerprint, authorized_keys, openssh。</p>
    <h2>仕組み</h2>
    <ul>
      <li>ページを開けばそのまま使えます。アカウントも登録も課金もありません。</li>
      <li>すべて自分のブラウザ内の JavaScript として動くので、入力がサーバーに届くことはありません。</li>
      <li>設定と保存した内容はこのブラウザにあり、いつでも消せます。</li>
      <li>サイト全体が <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a> でオープンソースです。</li>
    </ul>
    <h2>よくある質問</h2>
    <dl>
      <dt>SSH 鍵 は無料ですか。</dt><dd>はい。SSH 鍵 は無料で使えます。アカウントも登録も利用制限もありません。</dd><dt>SSH 鍵 はデータをアップロードしますか。</dt><dd>いいえ。すべてブラウザ内で動くので、渡したテキスト、ファイル、画像が端末から出ることはありません。</dd><dt>SSH 鍵 はオフラインでも動きますか。</dt><dd>はい。ページを読み込んだ後は、接続がなくても動き続けます。</dd><dt>ソースコードはどこにありますか。</dt><dd>Toolbox は https://github.com/samalstudios/jsglobe でオープンソースです。</dd>
    </dl>
    <h2>関連するツール</h2>
    <ul><li><a href="https://jsglobe.com/ja/apps/hash-text">テキストのハッシュ</a> - MD5、SHA-1、SHA-256、SHA-512 のダイジェスト</li><li><a href="https://jsglobe.com/ja/apps/hmac-generator">HMAC</a> - 鍵付きハッシュのメッセージ認証コード</li><li><a href="https://jsglobe.com/ja/apps/encryption">暗号化 / 復号</a> - パスフレーズによる AES-GCM のテキスト暗号化</li><li><a href="https://jsglobe.com/ja/apps/token-generator">トークン生成</a> - 強い乱数パスワードと API トークン</li><li><a href="https://jsglobe.com/ja/apps/otp-generator">TOTP</a> - 秘密鍵から作る時刻ベースのワンタイムパスワード</li><li><a href="https://jsglobe.com/ja/apps/basic-auth">Basic 認証</a> - 資格情報から Authorization ヘッダを作る</li><li><a href="https://jsglobe.com/ja/apps/rsa-keygen">鍵ペア</a> - RSA と楕円曲線の鍵を PEM で生成</li><li><a href="https://jsglobe.com/ja/apps/password-strength">パスワード強度</a> - エントロピー、弱点、解読までの時間</li></ul>
