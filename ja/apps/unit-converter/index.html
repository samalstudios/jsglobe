    <h2>単位変換 でできること</h2>
    <p>単位変換 は Toolbox の数学と単位セクションにあり、関連する 3 個のツールと並んでいます。https://jsglobe.com/ja/apps/unit-converter ですぐに開き、ページを読み込んだ後はオフラインでも動き、保存したものはサーバーではなくこのブラウザに残ります。</p>
    <p>こんな用途にも: unit, convert, length, weight, temperature, bytes。</p>

    </ul>
