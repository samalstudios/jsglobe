    <h1>サイコロ</h1>
    <p>どんなサイコロも振って出目の分布を見る。このツールはすべてブラウザで動きます。貼り付けたものも開いたものも、端末から出ることはありません。</p>
    <h2>サイコロ でできること</h2>
    <p>サイコロ は Toolbox のゲームセクションにあり、関連する 8 個のツールと並んでいます。https://jsglobe.com/ja/apps/dice-roller ですぐに開き、ページを読み込んだ後はオフラインでも動き、保存したものはサーバーではなくこのブラウザに残ります。</p>
    <p>こんな用途にも: dice, d20, d6, roll, rpg, tabletop, random, probability。</p>
    <h2>仕組み</h2>
    <ul>
      <li>ページを開けばそのまま使えます。アカウントも登録も課金もありません。</li>
      <li>すべて自分のブラウザ内の JavaScript として動くので、入力がサーバーに届くことはありません。</li>
      <li>設定と保存した内容はこのブラウザにあり、いつでも消せます。</li>
      <li>サイト全体が <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a> でオープンソースです。</li>
    </ul>
    <h2>よくある質問</h2>
    <dl>
      <dt>サイコロ は無料ですか。</dt><dd>はい。サイコロ は無料で使えます。アカウントも登録も利用制限もありません。</dd><dt>サイコロ はデータをアップロードしますか。</dt><dd>いいえ。すべてブラウザ内で動くので、渡したテキスト、ファイル、画像が端末から出ることはありません。</dd><dt>サイコロ はオフラインでも動きますか。</dt><dd>はい。ページを読み込んだ後は、接続がなくても動き続けます。</dd><dt>ソースコードはどこにありますか。</dt><dd>Toolbox は https://github.com/samalstudios/jsglobe でオープンソースです。</dd>
    </dl>
    <h2>関連するツール</h2>
    <ul><li><a href="https://jsglobe.com/ja/apps/typing-test">タイピング測定</a> - 毎分単語数、正確さ、苦手なキー</li><li><a href="https://jsglobe.com/ja/apps/chess">チェス</a> - コンピュータと対戦し、定跡を学び、戦術を鍛える</li><li><a href="https://jsglobe.com/ja/apps/game-sudoku">数独</a> - メモとヒント付きの自動生成問題</li><li><a href="https://jsglobe.com/ja/apps/game-tetris">ブロック</a> - 落ちてくるピースを積んで列を消す</li><li><a href="https://jsglobe.com/ja/apps/game-memory">神経衰弱</a> - カードをめくって同じ絵柄を探す</li><li><a href="https://jsglobe.com/ja/apps/game-word">ワード当て</a> - 5 文字の単語を 6 回以内に当てる</li><li><a href="https://jsglobe.com/ja/apps/drum-kit">ドラムキット</a> - パッドを叩き、16 ステップのビートを組む</li><li><a href="https://jsglobe.com/ja/apps/tuner">チューナー</a> - ギター、ベース、ウクレレを耳かマイクで合わせる</li></ul>
