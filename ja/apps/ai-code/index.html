    <h1>AI コード</h1>
    <p>コードを説明、レビュー、文書化、変換。このツールはすべてブラウザで動きます。貼り付けたものも開いたものも、端末から出ることはありません。</p>
    <h2>AI コード でできること</h2>
    <p>AI コード は Toolbox のローカル AIセクションにあり、関連する 5 個のツールと並んでいます。https://jsglobe.com/ja/apps/ai-code ですぐに開き、ページを読み込んだ後はオフラインでも動き、保存したものはサーバーではなくこのブラウザに残ります。</p>
    <p>こんな用途にも: ai, code, explain, review, refactor, tests, llm。</p>
    <h2>仕組み</h2>
    <ul>
      <li>ページを開けばそのまま使えます。アカウントも登録も課金もありません。</li>
      <li>すべて自分のブラウザ内の JavaScript として動くので、入力がサーバーに届くことはありません。</li>
      <li>設定と保存した内容はこのブラウザにあり、いつでも消せます。</li>
      <li>サイト全体が <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a> でオープンソースです。</li>
    </ul>
    <h2>よくある質問</h2>
    <dl>
      <dt>AI コード は無料ですか。</dt><dd>はい。AI コード は無料で使えます。アカウントも登録も利用制限もありません。</dd><dt>AI コード はデータをアップロードしますか。</dt><dd>いいえ。すべてブラウザ内で動くので、渡したテキスト、ファイル、画像が端末から出ることはありません。</dd><dt>AI コード はオフラインでも動きますか。</dt><dd>はい。ページを読み込んだ後は、接続がなくても動き続けます。</dd><dt>ソースコードはどこにありますか。</dt><dd>Toolbox は https://github.com/samalstudios/jsglobe でオープンソースです。</dd>
    </dl>
