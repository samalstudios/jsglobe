    <h1>ポスタースタジオ</h1>
    <p>イベント QR 付きのポスターと SNS 用の派生を作る。このツールはすべてブラウザで動きます。貼り付けたものも開いたものも、端末から出ることはありません。</p>
    <h2>ポスタースタジオ でできること</h2>
    <p>ポスタースタジオ は Toolbox のメディアセクションにあり、関連する 8 個のツールと並んでいます。https://jsglobe.com/ja/apps/poster-studio ですぐに開き、ページを読み込んだ後はオフラインでも動き、保存したものはサーバーではなくこのブラウザに残ります。</p>
    <p>こんな用途にも: poster, flyer, design, layout, template, event, qr, social, instagram, story, banner, print, typography。</p>
    <h2>仕組み</h2>
    <ul>
      <li>ページを開けばそのまま使えます。アカウントも登録も課金もありません。</li>
      <li>すべて自分のブラウザ内の JavaScript として動くので、入力がサーバーに届くことはありません。</li>
      <li>設定と保存した内容はこのブラウザにあり、いつでも消せます。</li>
      <li>サイト全体が <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a> でオープンソースです。</li>
    </ul>
    <h2>よくある質問</h2>
    <dl>
      <dt>ポスタースタジオ は無料ですか。</dt><dd>はい。ポスタースタジオ は無料で使えます。アカウントも登録も利用制限もありません。</dd><dt>ポスタースタジオ はデータをアップロードしますか。</dt><dd>いいえ。すべてブラウザ内で動くので、渡したテキスト、ファイル、画像が端末から出ることはありません。</dd><dt>ポスタースタジオ はオフラインでも動きますか。</dt><dd>はい。ページを読み込んだ後は、接続がなくても動き続けます。</dd><dt>ソースコードはどこにありますか。</dt><dd>Toolbox は https://github.com/samalstudios/jsglobe でオープンソースです。</dd>
    </dl>
    <h2>関連するツール</h2>
    <ul><li><a href="https://jsglobe.com/ja/apps/qr-generator">QR コード</a> - オフラインで読み取れる QR コードを生成</li><li><a href="https://jsglobe.com/ja/apps/image-converter">画像変換</a> - ブラウザ内で画像を変換、リサイズ、圧縮</li><li><a href="https://jsglobe.com/ja/apps/png-outline">PNG アウトライン</a> - 画像の輪郭をなぞって SVG にする</li><li><a href="https://jsglobe.com/ja/apps/gif-maker">GIF メーカー</a> - 画像や動画クリップをアニメーション GIF にする</li><li><a href="https://jsglobe.com/ja/apps/media-converter">動画と音声</a> - WebAssembly で動画と音声を変換</li><li><a href="https://jsglobe.com/ja/apps/barcode-generator">バーコード</a> - Code 128、EAN、Code 39 を SVG で</li><li><a href="https://jsglobe.com/ja/apps/icon-studio">アイコンスタジオ</a> - 数千の部品からアイコンを組む、または言葉で描く</li><li><a href="https://jsglobe.com/ja/apps/favicon-generator">ファビコン作成</a> - すべてのアイコンサイズ、.ico、マニフェスト</li></ul>
