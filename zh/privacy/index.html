    <h1>隐私政策</h1>
    <p>Toolbox 是一个静态网站。每个工具都在浏览器中运行，你使用的文本、文件和图片从不会被上传。</p>
    <h2>Cookie</h2>
    <p>Google Analytics 4 只有在你接受 Cookie 提示后才会加载，并启用 IP 匿名化，不使用广告或个性化存储。选择拒绝则不会设置任何分析 Cookie。你可以随时在本页或设置中更改这一选择。</p>
    <h2>本地数据</h2>
    <p>备忘、任务、设置和应用状态保存在这个浏览器的 localStorage 和 IndexedDB 中，可以在设置的“数据”一节中清除。这里没有账号，也不收集邮箱。</p>
    <h2>第三方</h2>
    <p>有些工具只在你主动发起时才会调用公共服务，例如用于查询的 DNS 解析器、用于网速测试的 Cloudflare、用于投资组合价格的 CoinGecko 和一个开放汇率数据集，以及用于 AI 模型和媒体编解码器的公共 CDN。</p>
    <h2>源代码</h2>
    <p>本站在 <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a> 开源。</p>
    <p><a href="https://jsglobe.com/zh/apps">浏览全部 118 个工具</a></p>
