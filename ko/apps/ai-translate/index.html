    <h1>번역</h1>
    <p>이 기기의 모델로 텍스트를 번역하기. 이 도구는 전부 브라우저에서 돌아갑니다. 붙여 넣거나 여는 것은 기기를 벗어나지 않습니다.</p>
    <h2>번역이 하는 일</h2>
    <p>번역은 Toolbox의 로컬 AI 구역에 있으며, 관련 도구 5개와 나란히 놓여 있습니다. https://jsglobe.com/ko/apps/ai-translate에서 바로 열리고, 페이지를 읽어들인 뒤에는 오프라인에서도 돌아가며, 저장한 것은 서버가 아니라 이 브라우저에 남습니다.</p>
    <p>이런 데도 쓸모 있습니다: translate, language, ai, localise, localize, spanish, french, japanese.</p>
    <h2>어떻게 돌아가는가</h2>
    <ul>
      <li>페이지를 열면 바로 쓸 수 있습니다. 계정도, 가입도, 결제도 없습니다.</li>
      <li>모든 것이 자기 브라우저 안의 JavaScript로 돌아가므로, 입력이 서버에 닿는 일이 없습니다.</li>
      <li>설정과 저장한 작업은 이 브라우저에 있으며 언제든 지울 수 있습니다.</li>
      <li>사이트 전체가 <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>에서 오픈 소스입니다.</li>
    </ul>
    <h2>자주 묻는 질문</h2>
    <dl>
      <dt>번역은 무료인가요?</dt><dd>네. 번역은 무료로 쓸 수 있고, 계정도 가입도 사용 제한도 없습니다.</dd><dt>번역이 내 데이터를 올리나요?</dt><dd>아니요. 전부 브라우저에서 돌아가므로 건넨 텍스트, 파일, 이미지가 기기를 벗어나지 않습니다.</dd><dt>번역이 오프라인에서도 되나요?</dt><dd>네. 페이지를 읽어들인 뒤에는 연결 없이도 계속 돌아갑니다.</dd><dt>소스 코드는 어디에 있나요?</dt><dd>Toolbox는 https://github.com/samalstudios/jsglobe에서 오픈 소스입니다.</dd>
    </dl>
    <h2>관련 도구</h2>
    <ul><li><a href="https://jsglobe.com/ko/apps/ai-chat">AI 채팅</a> - 이 기기에서 도는 모델과 대화하기</li><li><a href="https://jsglobe.com/ko/apps/ai-code">AI 코드</a> - 코드를 설명하고 검토하고 문서화하고 변환하기</li><li><a href="https://jsglobe.com/ko/apps/ai-writer">AI 글쓰기</a> - 요약, 다시 쓰기, 번역, 교정</li><li><a href="https://jsglobe.com/ko/apps/ai-regex">AI 정규식</a> - 패턴을 설명하면 검증된 정규식을 얻습니다</li><li><a href="https://jsglobe.com/ko/apps/inspector">Inspector AI</a> - 자기 문서에 질문하고 근거와 함께 답 받기</li></ul>
