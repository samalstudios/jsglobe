    <h1>토큰 생성기</h1>
    <p>튼튼한 무작위 비밀번호와 API 토큰. 이 도구는 전부 브라우저에서 돌아갑니다. 붙여 넣거나 여는 것은 기기를 벗어나지 않습니다.</p>
    <h2>토큰 생성기이 하는 일</h2>
    <p>토큰 생성기은 Toolbox의 암호와 보안 구역에 있으며, 관련 도구 8개와 나란히 놓여 있습니다. https://jsglobe.com/ko/apps/token-generator에서 바로 열리고, 페이지를 읽어들인 뒤에는 오프라인에서도 돌아가며, 저장한 것은 서버가 아니라 이 브라우저에 남습니다.</p>
    <p>이런 데도 쓸모 있습니다: password, token, random, secret, entropy.</p>
    <h2>어떻게 돌아가는가</h2>
    <ul>
      <li>페이지를 열면 바로 쓸 수 있습니다. 계정도, 가입도, 결제도 없습니다.</li>
      <li>모든 것이 자기 브라우저 안의 JavaScript로 돌아가므로, 입력이 서버에 닿는 일이 없습니다.</li>
      <li>설정과 저장한 작업은 이 브라우저에 있으며 언제든 지울 수 있습니다.</li>
      <li>사이트 전체가 <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>에서 오픈 소스입니다.</li>
    </ul>
    <h2>자주 묻는 질문</h2>
    <dl>
      <dt>토큰 생성기은 무료인가요?</dt><dd>네. 토큰 생성기은 무료로 쓸 수 있고, 계정도 가입도 사용 제한도 없습니다.</dd><dt>토큰 생성기이 내 데이터를 올리나요?</dt><dd>아니요. 전부 브라우저에서 돌아가므로 건넨 텍스트, 파일, 이미지가 기기를 벗어나지 않습니다.</dd><dt>토큰 생성기이 오프라인에서도 되나요?</dt><dd>네. 페이지를 읽어들인 뒤에는 연결 없이도 계속 돌아갑니다.</dd><dt>소스 코드는 어디에 있나요?</dt><dd>Toolbox는 https://github.com/samalstudios/jsglobe에서 오픈 소스입니다.</dd>
    </dl>
    <h2>관련 도구</h2>
    <ul><li><a href="https://jsglobe.com/ko/apps/hash-text">텍스트 해시</a> - MD5, SHA-1, SHA-256, SHA-512 다이제스트</li><li><a href="https://jsglobe.com/ko/apps/hmac-generator">HMAC</a> - 키를 쓰는 메시지 인증 코드</li><li><a href="https://jsglobe.com/ko/apps/encryption">암호화 / 복호화</a> - 암호 문구로 하는 AES-GCM 텍스트 암호화</li><li><a href="https://jsglobe.com/ko/apps/otp-generator">TOTP</a> - 비밀 키로 만드는 시간 기반 일회용 비밀번호</li><li><a href="https://jsglobe.com/ko/apps/basic-auth">기본 인증</a> - 자격 증명으로 Authorization 헤더 만들기</li><li><a href="https://jsglobe.com/ko/apps/rsa-keygen">키 쌍</a> - RSA와 타원 곡선 키를 PEM으로 만들기</li><li><a href="https://jsglobe.com/ko/apps/password-strength">비밀번호 강도</a> - 엔트로피, 약점, 깨지기까지 걸리는 시간</li><li><a href="https://jsglobe.com/ko/apps/cert-decoder">인증서 디코더</a> - X.509 인증서나 서명 요청 읽기</li></ul>
