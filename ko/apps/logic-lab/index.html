    <h1>논리 실험실</h1>
    <p>게이트, 플립플롭, 카운터, 디코더, LED 표시. 이 도구는 전부 브라우저에서 돌아갑니다. 붙여 넣거나 여는 것은 기기를 벗어나지 않습니다.</p>
    <h2>논리 실험실이 하는 일</h2>
    <p>논리 실험실은 Toolbox의 과학 구역에 있으며, 관련 도구 5개와 나란히 놓여 있습니다. https://jsglobe.com/ko/apps/logic-lab에서 바로 열리고, 페이지를 읽어들인 뒤에는 오프라인에서도 돌아가며, 저장한 것은 서버가 아니라 이 브라우저에 남습니다.</p>
    <p>이런 데도 쓸모 있습니다: logic, digital, gate, and, or, xor, flip-flop, counter, seven segment, led matrix, decoder, multiplexer, boolean, circuit.</p>
    <h2>어떻게 돌아가는가</h2>
    <ul>
      <li>페이지를 열면 바로 쓸 수 있습니다. 계정도, 가입도, 결제도 없습니다.</li>
      <li>모든 것이 자기 브라우저 안의 JavaScript로 돌아가므로, 입력이 서버에 닿는 일이 없습니다.</li>
      <li>설정과 저장한 작업은 이 브라우저에 있으며 언제든 지울 수 있습니다.</li>
      <li>사이트 전체가 <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>에서 오픈 소스입니다.</li>
    </ul>
    <h2>자주 묻는 질문</h2>
    <dl>
      <dt>논리 실험실은 무료인가요?</dt><dd>네. 논리 실험실은 무료로 쓸 수 있고, 계정도 가입도 사용 제한도 없습니다.</dd><dt>논리 실험실이 내 데이터를 올리나요?</dt><dd>아니요. 전부 브라우저에서 돌아가므로 건넨 텍스트, 파일, 이미지가 기기를 벗어나지 않습니다.</dd><dt>논리 실험실이 오프라인에서도 되나요?</dt><dd>네. 페이지를 읽어들인 뒤에는 연결 없이도 계속 돌아갑니다.</dd><dt>소스 코드는 어디에 있나요?</dt><dd>Toolbox는 https://github.com/samalstudios/jsglobe에서 오픈 소스입니다.</dd>
    </dl>
    <h2>관련 도구</h2>
    <ul><li><a href="https://jsglobe.com/ko/apps/periodic-table">주기율표</a> - 118개 원소 전부와 그 성질</li><li><a href="https://jsglobe.com/ko/apps/molecule-viewer">분자 보기</a> - 비타민, 약, 유명한 분자를 3D로</li><li><a href="https://jsglobe.com/ko/apps/circuit-lab">회로 실험실</a> - 기본 전자 회로를 만들고 모의 실험하기</li><li><a href="https://jsglobe.com/ko/apps/physics-lab">물리 실험실</a> - 공, 블록, 용수철, 막대, 잭, 모터</li><li><a href="https://jsglobe.com/ko/apps/optics-lab">광학 실험실</a> - 렌즈, 거울, 프리즘을 실제 광선 추적으로</li></ul>
