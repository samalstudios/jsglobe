    <h1>기기 정보</h1>
    <p>브라우저가 이 기기에 대해 아는 모든 것. 이 도구는 전부 브라우저에서 돌아갑니다. 붙여 넣거나 여는 것은 기기를 벗어나지 않습니다.</p>
    <h2>기기 정보이 하는 일</h2>
    <p>기기 정보은 Toolbox의 유틸리티 구역에 있으며, 관련 도구 8개와 나란히 놓여 있습니다. https://jsglobe.com/ko/apps/device-info에서 바로 열리고, 페이지를 읽어들인 뒤에는 오프라인에서도 돌아가며, 저장한 것은 서버가 아니라 이 브라우저에 남습니다.</p>
    <p>이런 데도 쓸모 있습니다: device, browser, screen, agent, info.</p>
    <h2>어떻게 돌아가는가</h2>
    <ul>
      <li>페이지를 열면 바로 쓸 수 있습니다. 계정도, 가입도, 결제도 없습니다.</li>
      <li>모든 것이 자기 브라우저 안의 JavaScript로 돌아가므로, 입력이 서버에 닿는 일이 없습니다.</li>
      <li>설정과 저장한 작업은 이 브라우저에 있으며 언제든 지울 수 있습니다.</li>
      <li>사이트 전체가 <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>에서 오픈 소스입니다.</li>
    </ul>
    <h2>자주 묻는 질문</h2>
    <dl>
      <dt>기기 정보은 무료인가요?</dt><dd>네. 기기 정보은 무료로 쓸 수 있고, 계정도 가입도 사용 제한도 없습니다.</dd><dt>기기 정보이 내 데이터를 올리나요?</dt><dd>아니요. 전부 브라우저에서 돌아가므로 건넨 텍스트, 파일, 이미지가 기기를 벗어나지 않습니다.</dd><dt>기기 정보이 오프라인에서도 되나요?</dt><dd>네. 페이지를 읽어들인 뒤에는 연결 없이도 계속 돌아갑니다.</dd><dt>소스 코드는 어디에 있나요?</dt><dd>Toolbox는 https://github.com/samalstudios/jsglobe에서 오픈 소스입니다.</dd>
    </dl>
    <h2>관련 도구</h2>
    <ul><li><a href="https://jsglobe.com/ko/apps/uuid-generator">UUID</a> - v4와 v7 식별자를 한꺼번에 만들기</li><li><a href="https://jsglobe.com/ko/apps/clock">시계</a> - 세계 시계, 스톱워치, 카운트다운</li><li><a href="https://jsglobe.com/ko/apps/calendar">달력</a> - 작업 공간마다 일정을 저장하는 월간 보기</li><li><a href="https://jsglobe.com/ko/apps/portfolio">포트폴리오</a> - 보유, 배분, 손익을 따라가기</li><li><a href="https://jsglobe.com/ko/apps/notes">메모</a> - 이 작업 공간에 저장되는 짧은 메모</li><li><a href="https://jsglobe.com/ko/apps/todo">할 일</a> - 작업 공간마다 두는 가벼운 체크리스트</li><li><a href="https://jsglobe.com/ko/apps/timezone-planner">시간대</a> - 도시를 나란히 놓고 겹치는 시간 찾기</li><li><a href="https://jsglobe.com/ko/apps/iban-validator">IBAN 검사</a> - 계좌 번호를 확인하고 구성을 읽기</li></ul>
