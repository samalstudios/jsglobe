    <h1>URL 인코딩</h1>
    <p>URL 구성 요소를 퍼센트 인코딩하고 되돌리기. 이 도구는 전부 브라우저에서 돌아갑니다. 붙여 넣거나 여는 것은 기기를 벗어나지 않습니다.</p>
    <h2>URL 인코딩이 하는 일</h2>
    <p>URL 인코딩은 Toolbox의 웹 구역에 있으며, 관련 도구 8개와 나란히 놓여 있습니다. https://jsglobe.com/ko/apps/url-encoder에서 바로 열리고, 페이지를 읽어들인 뒤에는 오프라인에서도 돌아가며, 저장한 것은 서버가 아니라 이 브라우저에 남습니다.</p>
    <p>이런 데도 쓸모 있습니다: url, encode, decode, percent, uri.</p>
    <h2>어떻게 돌아가는가</h2>
    <ul>
      <li>페이지를 열면 바로 쓸 수 있습니다. 계정도, 가입도, 결제도 없습니다.</li>
      <li>모든 것이 자기 브라우저 안의 JavaScript로 돌아가므로, 입력이 서버에 닿는 일이 없습니다.</li>
      <li>설정과 저장한 작업은 이 브라우저에 있으며 언제든 지울 수 있습니다.</li>
      <li>사이트 전체가 <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>에서 오픈 소스입니다.</li>
    </ul>
    <h2>자주 묻는 질문</h2>
    <dl>
      <dt>URL 인코딩은 무료인가요?</dt><dd>네. URL 인코딩은 무료로 쓸 수 있고, 계정도 가입도 사용 제한도 없습니다.</dd><dt>URL 인코딩이 내 데이터를 올리나요?</dt><dd>아니요. 전부 브라우저에서 돌아가므로 건넨 텍스트, 파일, 이미지가 기기를 벗어나지 않습니다.</dd><dt>URL 인코딩이 오프라인에서도 되나요?</dt><dd>네. 페이지를 읽어들인 뒤에는 연결 없이도 계속 돌아갑니다.</dd><dt>소스 코드는 어디에 있나요?</dt><dd>Toolbox는 https://github.com/samalstudios/jsglobe에서 오픈 소스입니다.</dd>
    </dl>
    <h2>관련 도구</h2>
    <ul><li><a href="https://jsglobe.com/ko/apps/url-parser">URL 파서</a> - URL을 구성 요소와 질의 매개변수로 나누기</li><li><a href="https://jsglobe.com/ko/apps/html-entities">HTML 엔티티</a> - HTML 엔티티를 이스케이프하고 되돌리기</li><li><a href="https://jsglobe.com/ko/apps/jwt-parser">JWT 파서</a> - JSON 웹 토큰을 풀고 살펴보기</li><li><a href="https://jsglobe.com/ko/apps/keycode-info">키코드 정보</a> - 키보드 이벤트를 키마다 살펴보기</li><li><a href="https://jsglobe.com/ko/apps/slugify">슬러그 만들기</a> - 어떤 문자열이든 깔끔한 URL 슬러그로</li><li><a href="https://jsglobe.com/ko/apps/http-status">HTTP 상태</a> - 검색할 수 있는 HTTP 상태 코드 참고서</li><li><a href="https://jsglobe.com/ko/apps/http-headers">헤더 검토</a> - 응답 헤더를 보안과 개인정보 관점에서 채점하기</li><li><a href="https://jsglobe.com/ko/apps/css-gradient">그레이디언트 만들기</a> - 끌 수 있는 색 정지점으로 CSS 그레이디언트 만들기</li></ul>
