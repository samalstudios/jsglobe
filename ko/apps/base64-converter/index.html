    <h1>Base64</h1>
    <p>텍스트나 파일을 인코딩하고 디코딩하기. 이 도구는 전부 브라우저에서 돌아갑니다. 붙여 넣거나 여는 것은 기기를 벗어나지 않습니다.</p>

    <p>이런 데도 쓸모 있습니다: base64, encode, decode, atob, btoa, data uri.</p>
