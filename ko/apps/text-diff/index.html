    <h1>텍스트 차이</h1>
    <p>두 글을 줄 단위로 비교하기. 이 도구는 전부 브라우저에서 돌아갑니다. 붙여 넣거나 여는 것은 기기를 벗어나지 않습니다.</p>
    <h2>텍스트 차이이 하는 일</h2>
    <p>텍스트 차이은 Toolbox의 텍스트 구역에 있으며, 관련 도구 7개와 나란히 놓여 있습니다. https://jsglobe.com/ko/apps/text-diff에서 바로 열리고, 페이지를 읽어들인 뒤에는 오프라인에서도 돌아가며, 저장한 것은 서버가 아니라 이 브라우저에 남습니다.</p>
    <p>이런 데도 쓸모 있습니다: diff, compare, changes, merge.</p>
    <h2>어떻게 돌아가는가</h2>
    <ul>
      <li>페이지를 열면 바로 쓸 수 있습니다. 계정도, 가입도, 결제도 없습니다.</li>
      <li>모든 것이 자기 브라우저 안의 JavaScript로 돌아가므로, 입력이 서버에 닿는 일이 없습니다.</li>
      <li>설정과 저장한 작업은 이 브라우저에 있으며 언제든 지울 수 있습니다.</li>
      <li>사이트 전체가 <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>에서 오픈 소스입니다.</li>
    </ul>
    <h2>자주 묻는 질문</h2>
    <dl>
      <dt>텍스트 차이은 무료인가요?</dt><dd>네. 텍스트 차이은 무료로 쓸 수 있고, 계정도 가입도 사용 제한도 없습니다.</dd><dt>텍스트 차이이 내 데이터를 올리나요?</dt><dd>아니요. 전부 브라우저에서 돌아가므로 건넨 텍스트, 파일, 이미지가 기기를 벗어나지 않습니다.</dd><dt>텍스트 차이이 오프라인에서도 되나요?</dt><dd>네. 페이지를 읽어들인 뒤에는 연결 없이도 계속 돌아갑니다.</dd><dt>소스 코드는 어디에 있나요?</dt><dd>Toolbox는 https://github.com/samalstudios/jsglobe에서 오픈 소스입니다.</dd>
    </dl>
    <h2>관련 도구</h2>
    <ul><li><a href="https://jsglobe.com/ko/apps/lorem-ipsum">로렘 입숨</a> - 단어, 문장, 목록 형태의 채움 글</li><li><a href="https://jsglobe.com/ko/apps/text-stats">텍스트 통계</a> - 글자 수, 읽는 시간, 문자 분석</li><li><a href="https://jsglobe.com/ko/apps/markdown-preview">마크다운</a> - 마크다운을 쓰고 HTML 미리 보기</li><li><a href="https://jsglobe.com/ko/apps/emoji-picker">이모지 고르기</a> - 이모지를 코드 포인트와 함께 훑고 찾고 복사하기</li><li><a href="https://jsglobe.com/ko/apps/unicode-tables">유니코드 표</a> - 유니코드 블록을 훑고 문자를 살펴보기</li><li><a href="https://jsglobe.com/ko/apps/doc-editor">문서 스튜디오</a> - 문서를 쓰고 서식을 넣고 PDF나 Word로 내보내기, 전부 브라우저에서</li><li><a href="https://jsglobe.com/ko/apps/letters">글자</a> - 그리스, 키릴, 일본, 한국, 중국 문자 익히기</li></ul>
