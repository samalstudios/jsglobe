    <h1>IP 변환</h1>
    <p>IPv4를 10진, 16진, 2진, 8진으로. 이 도구는 전부 브라우저에서 돌아갑니다. 붙여 넣거나 여는 것은 기기를 벗어나지 않습니다.</p>
    <h2>IP 변환이 하는 일</h2>
    <p>IP 변환은 Toolbox의 네트워크 구역에 있으며, 관련 도구 6개와 나란히 놓여 있습니다. https://jsglobe.com/ko/apps/ip-converter에서 바로 열리고, 페이지를 읽어들인 뒤에는 오프라인에서도 돌아가며, 저장한 것은 서버가 아니라 이 브라우저에 남습니다.</p>
    <p>이런 데도 쓸모 있습니다: ip, ipv4, convert, decimal, binary.</p>
    <h2>어떻게 돌아가는가</h2>
    <ul>
      <li>페이지를 열면 바로 쓸 수 있습니다. 계정도, 가입도, 결제도 없습니다.</li>
      <li>모든 것이 자기 브라우저 안의 JavaScript로 돌아가므로, 입력이 서버에 닿는 일이 없습니다.</li>
      <li>설정과 저장한 작업은 이 브라우저에 있으며 언제든 지울 수 있습니다.</li>
      <li>사이트 전체가 <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>에서 오픈 소스입니다.</li>
    </ul>

    <dl>
      <dt>IP 변환은 무료인가요?</dt><dd>네. IP 변환은 무료로 쓸 수 있고, 계정도 가입도 사용 제한도 없습니다.</dd><dt>IP 변환이 내 데이터를 올리나요?</dt><dd>아니요. 전부 브라우저에서 돌아가므로 건넨 텍스트, 파일, 이미지가 기기를 벗어나지 않습니다.</dd><dt>IP 변환이 오프라인에서도 되나요?</dt><dd>네. 페이지를 읽어들인 뒤에는 연결 없이도 계속 돌아갑니다.</dd><dt>소스 코드는 어디에 있나요?</dt><dd>Toolbox는 https://github.com/samalstudios/jsglobe에서 오픈 소스입니다.</dd>
