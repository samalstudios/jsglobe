    <h1>솔리테어</h1>
    <p>클론다이크, 한 장 뽑기와 세 장 뽑기. 이 도구는 전부 브라우저에서 돌아갑니다. 붙여 넣거나 여는 것은 기기를 벗어나지 않습니다.</p>
    <h2>솔리테어이 하는 일</h2>
    <p>솔리테어은 Toolbox의 놀이 구역에 있으며, 관련 도구 8개와 나란히 놓여 있습니다. https://jsglobe.com/ko/apps/game-solitaire에서 바로 열리고, 페이지를 읽어들인 뒤에는 오프라인에서도 돌아가며, 저장한 것은 서버가 아니라 이 브라우저에 남습니다.</p>
    <p>이런 데도 쓸모 있습니다: game, solitaire, klondike, cards, patience, retro.</p>
    <h2>어떻게 돌아가는가</h2>
    <ul>
      <li>페이지를 열면 바로 쓸 수 있습니다. 계정도, 가입도, 결제도 없습니다.</li>
      <li>모든 것이 자기 브라우저 안의 JavaScript로 돌아가므로, 입력이 서버에 닿는 일이 없습니다.</li>
      <li>설정과 저장한 작업은 이 브라우저에 있으며 언제든 지울 수 있습니다.</li>
      <li>사이트 전체가 <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>에서 오픈 소스입니다.</li>
    </ul>
    <h2>자주 묻는 질문</h2>
    <dl>
      <dt>솔리테어은 무료인가요?</dt><dd>네. 솔리테어은 무료로 쓸 수 있고, 계정도 가입도 사용 제한도 없습니다.</dd><dt>솔리테어이 내 데이터를 올리나요?</dt><dd>아니요. 전부 브라우저에서 돌아가므로 건넨 텍스트, 파일, 이미지가 기기를 벗어나지 않습니다.</dd><dt>솔리테어이 오프라인에서도 되나요?</dt><dd>네. 페이지를 읽어들인 뒤에는 연결 없이도 계속 돌아갑니다.</dd><dt>소스 코드는 어디에 있나요?</dt><dd>Toolbox는 https://github.com/samalstudios/jsglobe에서 오픈 소스입니다.</dd>
    </dl>
    <h2>관련 도구</h2>
    <ul><li><a href="https://jsglobe.com/ko/apps/typing-test">타자 검사</a> - 분당 단어 수, 정확도, 어려운 키</li><li><a href="https://jsglobe.com/ko/apps/chess">체스</a> - 컴퓨터와 두고, 오프닝을 익히고, 전술을 훈련하기</li><li><a href="https://jsglobe.com/ko/apps/game-sudoku">스도쿠</a> - 메모와 힌트가 있는 생성된 퍼즐</li><li><a href="https://jsglobe.com/ko/apps/game-tetris">블록</a> - 떨어지는 조각을 쌓아 줄을 없애기</li><li><a href="https://jsglobe.com/ko/apps/game-memory">짝 맞추기</a> - 카드를 뒤집어 같은 짝 찾기</li><li><a href="https://jsglobe.com/ko/apps/game-word">단어 맞히기</a> - 여섯 번 안에 다섯 글자 단어 찾기</li><li><a href="https://jsglobe.com/ko/apps/drum-kit">드럼 키트</a> - 패드를 치고 16스텝 비트 만들기</li><li><a href="https://jsglobe.com/ko/apps/tuner">튜너</a> - 기타, 베이스, 우쿨렐레를 귀나 마이크로 맞추기</li></ul>
