  <main>
    <h1>개인정보 처리방침</h1>
    <p>Toolbox는 정적 사이트입니다. 모든 도구가 브라우저에서 돌아가며, 쓰는 텍스트와 파일, 이미지는 결코 올라가지 않습니다.</p>
    <h2>쿠키</h2>
    <p>Google Analytics 4는 쿠키 배너에 동의한 뒤에만 불러오며, IP를 익명화하고 광고나 개인화용 저장은 하지 않습니다. 거부하면 분석 쿠키를 두지 않습니다. 이 선택은 이 페이지나 설정에서 언제든 바꿀 수 있습니다.</p>
    <h2>로컬 데이터</h2>
    <p>메모, 할 일, 설정, 앱 상태는 이 브라우저의 로컬 저장소와 IndexedDB에 있으며, 설정의 데이터에서 지울 수 있습니다. 계정도 이메일 수집도 없습니다.</p>
    <h2>제삼자</h2>
    <p>일부 도구는 요청할 때만 공개 서비스를 부릅니다. 조회를 위한 DNS 리졸버, 속도 측정을 위한 Cloudflare, 포트폴리오 시세를 위한 CoinGecko와 공개 환율 데이터, AI 모델과 미디어 코덱을 위한 공개 CDN 같은 것들입니다.</p>
