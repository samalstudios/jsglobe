    <ul><li><a href="https://jsglobe.com/ko/apps/hash-text">텍스트 해시</a> - MD5, SHA-1, SHA-256, SHA-512 다이제스트</li><li><a href="https://jsglobe.com/ko/apps/hmac-generator">HMAC</a> - 키를 쓰는 메시지 인증 코드</li><li><a href="https://jsglobe.com/ko/apps/encryption">암호화 / 복호화</a> - 암호 문구로 하는 AES-GCM 텍스트 암호화</li><li><a href="https://jsglobe.com/ko/apps/token-generator">토큰 생성기</a> - 튼튼한 무작위 비밀번호와 API 토큰</li><li><a href="https://jsglobe.com/ko/apps/otp-generator">TOTP</a> - 비밀 키로 만드는 시간 기반 일회용 비밀번호</li><li><a href="https://jsglobe.com/ko/apps/basic-auth">기본 인증</a> - 자격 증명으로 Authorization 헤더 만들기</li><li><a href="https://jsglobe.com/ko/apps/rsa-keygen">키 쌍</a> - RSA와 타원 곡선 키를 PEM으로 만들기</li><li><a href="https://jsglobe.com/ko/apps/password-strength">비밀번호 강도</a> - 엔트로피, 약점, 깨지기까지 걸리는 시간</li><li><a href="https://jsglobe.com/ko/apps/base64-converter">Base64</a> - 텍스트나 파일을 인코딩하고 디코딩하기</li><li><a href="https://jsglobe.com/ko/apps/color-converter">색 변환</a> - HEX, RGB, HSL, OKLCH와 대비 검사</li><li><a href="https://jsglobe.com/ko/apps/color-palette">색 팔레트</a> - Tailwind 식 단계, 색상환, 배색</li><li><a href="https://jsglobe.com/ko/apps/case-converter">표기법 변환</a> - camelCase, snake_case, kebab-case 등</li><li><a href="https://jsglobe.com/ko/apps/date-converter">날짜와 시간</a> - 유닉스 타임스탬프, ISO 8601, 상대 시간</li><li><a href="https://jsglobe.com/ko/apps/base-converter">진법 변환</a> - 2진, 8진, 10진, 16진과 임의의 진법</li><li><a href="https://jsglobe.com/ko/apps/json-yaml">JSON ⇄ YAML</a> - JSON과 YAML 문서를 서로 바꾸기</li><li><a href="https://jsglobe.com/ko/apps/text-encoder">텍스트 인코더</a> - 2진, 16진, 유니코드, NATO, 모스, ROT13</li><li><a href="https://jsglobe.com/ko/apps/list-converter">목록 변환</a> - 정렬, 중복 제거, 감싸기, 다시 합치기</li><li><a href="https://jsglobe.com/ko/apps/roman-numerals">로마 숫자</a> - 숫자와 로마 숫자를 서로 바꾸기</li><li><a href="https://jsglobe.com/ko/apps/url-encoder">URL 인코딩</a> - URL 구성 요소를 퍼센트 인코딩하고 되돌리기</li><li><a href="https://jsglobe.com/ko/apps/url-parser">URL 파서</a> - URL을 구성 요소와 질의 매개변수로 나누기</li><li><a href="https://jsglobe.com/ko/apps/html-entities">HTML 엔티티</a> - HTML 엔티티를 이스케이프하고 되돌리기</li><li><a href="https://jsglobe.com/ko/apps/jwt-parser">JWT 파서</a> - JSON 웹 토큰을 풀고 살펴보기</li><li><a href="https://jsglobe.com/ko/apps/keycode-info">키코드 정보</a> - 키보드 이벤트를 키마다 살펴보기</li><li><a href="https://jsglobe.com/ko/apps/slugify">슬러그 만들기</a> - 어떤 문자열이든 깔끔한 URL 슬러그로</li><li><a href="https://jsglobe.com/ko/apps/http-status">HTTP 상태</a> - 검색할 수 있는 HTTP 상태 코드 참고서</li><li><a href="https://jsglobe.com/ko/apps/json-formatter">JSON 정리</a> - JSON을 정리하고 검사하고 줄이고 살펴보기</li><li><a href="https://jsglobe.com/ko/apps/json-diff">JSON 차이</a> - 두 JSON 문서를 키 단위로 비교하기</li><li><a href="https://jsglobe.com/ko/apps/sql-formatter">SQL 정리</a> - SQL 문을 읽기 좋게 다듬기</li><li><a href="https://jsglobe.com/ko/apps/xml-formatter">XML 정리</a> - XML이나 HTML 마크업을 들여쓰고 줄이기</li><li><a href="https://jsglobe.com/ko/apps/crontab-generator">crontab</a> - cron 식을 설명하고 다음 실행을 미리 보기</li><li><a href="https://jsglobe.com/ko/apps/chmod-calculator">chmod</a> - 유닉스 권한을 8진수와 기호로</li><li><a href="https://jsglobe.com/ko/apps/regex-tester">정규식 시험기</a> - 패턴을 실시간 일치와 그룹으로 시험하기</li><li><a href="https://jsglobe.com/ko/apps/subnet-calculator">서브넷 계산기</a> - IPv4 CIDR 범위, 마스크, 호스트 수</li><li><a href="https://jsglobe.com/ko/apps/ip-converter">IP 변환</a> - IPv4를 10진, 16진, 2진, 8진으로</li><li><a href="https://jsglobe.com/ko/apps/mac-generator">MAC 주소</a> - MAC 주소를 만들고 형식 바꾸기</li><li><a href="https://jsglobe.com/ko/apps/lorem-ipsum">로렘 입숨</a> - 단어, 문장, 목록 형태의 채움 글</li><li><a href="https://jsglobe.com/ko/apps/text-stats">텍스트 통계</a> - 글자 수, 읽는 시간, 문자 분석</li><li><a href="https://jsglobe.com/ko/apps/text-diff">텍스트 차이</a> - 두 글을 줄 단위로 비교하기</li><li><a href="https://jsglobe.com/ko/apps/markdown-preview">마크다운</a> - 마크다운을 쓰고 HTML 미리 보기</li><li><a href="https://jsglobe.com/ko/apps/math-evaluator">수식 계산</a> - 함수와 상수를 쓰는 식 계산하기</li><li><a href="https://jsglobe.com/ko/apps/unit-converter">단위 변환</a> - 길이, 질량, 데이터, 온도, 시간</li><li><a href="https://jsglobe.com/ko/apps/qr-generator">QR 코드</a> - 오프라
