    <h1>Disclaimer</h1>
    <p>De hulpmiddelen op Toolbox zijn vereenvoudigde modellen, getoetst aan uitgewerkte voorbeelden maar met weglatingen. Behandel elke uitkomst als een startpunt dat nog bevestigd moet worden.</p>
    <h2>Geen professioneel advies</h2>
    <p>Niets hier is juridisch, fiscaal, financieel, medisch of technisch advies, en het gebruik ervan schept geen professionele relatie. Vraag voor alles met echte gevolgen iemand met de juiste kennis die jouw situatie kent.</p>
    <h2>Gegevens van elders</h2>
    <p>Sommige hulpmiddelen halen op jouw verzoek gegevens op bij openbare diensten, zoals wisselkoersen, prijzen en domeinopvragingen. Die gegevens zijn van die diensten, kunnen vertraagd of onjuist zijn, en worden ongecontroleerd doorgegeven zoals ze binnenkomen.</p>
    <h2>Aangeboden zoals ze zijn</h2>
    <p>Deze hulpmiddelen komen zonder enige garantie. Ze kunnen fouten bevatten, onbereikbaar zijn, veranderen of verdwijnen. Voor zover de wet dat toestaat wordt geen aansprakelijkheid aanvaard voor verlies dat voortkomt uit het gebruik ervan of uit vertrouwen op wat ze opleveren.</p>
    <h2>Lees de code</h2>
    <p>De site is open source, dus je kunt precies nagaan wat een hulpmiddel doet in plaats van het op zijn woord te geloven. Fouten zijn het melden waard.</p>
