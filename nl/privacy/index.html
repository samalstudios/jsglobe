    <h1>Privacyverklaring</h1>
    <p>Toolbox is een statische site. Elk hulpmiddel draait in je browser en de teksten, bestanden en afbeeldingen die je gebruikt worden nooit geüpload.</p>
    <h2>Cookies</h2>
    <p>Google Analytics 4 laadt pas nadat je de cookiemelding accepteert, met geanonimiseerd IP en zonder opslag voor advertenties of personalisatie. Weigeren plaatst geen analytics-cookies. Je kunt die keuze altijd wijzigen op deze pagina of in de instellingen.</p>
    <h2>Lokale gegevens</h2>
    <p>Notities, taken, instellingen en de staat van apps staan in de local storage en IndexedDB van deze browser, en kunnen bij de instellingen onder Gegevens gewist worden. Er zijn geen accounts en er worden geen e-mailadressen verzameld.</p>
    <h2>Derden</h2>
    <p>Sommige hulpmiddelen roepen alleen op jouw verzoek een openbare dienst aan, zoals DNS-resolvers voor opvragingen, Cloudflare voor de snelheidstest, CoinGecko en een open wisselkoersbestand voor portefeuilleprijzen, en openbare CDN's voor AI-modellen en mediacodecs.</p>
    <h2>Broncode</h2>
    <p>De site is open source op <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</p>
    <p><a href="https://jsglobe.com/nl/apps">Bekijk alle 129 hulpmiddelen</a></p>
