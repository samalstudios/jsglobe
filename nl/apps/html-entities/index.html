    <h1>HTML-entiteiten</h1>
    <p>HTML-entiteiten omzetten in beide richtingen. Dit hulpmiddel draait volledig in je browser: niets wat je plakt of opent verlaat je apparaat.</p>
    <h2>Wat HTML-entiteiten doet</h2>
    <p>HTML-entiteiten hoort bij het onderdeel Web van Toolbox en staat daar naast 8 verwante hulpmiddelen. Het opent meteen op https://jsglobe.com/nl/apps/html-entities, blijft werken zonder verbinding zodra de pagina geladen is, en bewaart wat je opslaat in deze browser in plaats van op een server.</p>
    <p>Ook handig voor: html, entities, escape, unescape, amp.</p>
    <h2>Hoe het werkt</h2>
    <ul>
      <li>Open de pagina en ga aan de slag. Geen account, geen aanmelding, geen betaalmuur.</li>
      <li>Alles draait als JavaScript in je eigen browser, dus wat je invoert bereikt nooit een server.</li>
      <li>Instellingen en opgeslagen werk staan in deze browser en kunnen op elk moment gewist worden.</li>
      <li>De hele site is open source op <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Vragen</h2>
