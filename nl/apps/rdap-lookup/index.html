    <h1>Domein opzoeken</h1>
    <p>RDAP-gegevens voor een domein, IP-adres of netwerk. Dit hulpmiddel draait volledig in je browser: niets wat je plakt of opent verlaat je apparaat.</p>
    <h2>Wat Domein opzoeken doet</h2>
    <p>Domein opzoeken hoort bij het onderdeel Netwerk van Toolbox en staat daar naast 6 verwante hulpmiddelen. Het opent meteen op https://jsglobe.com/nl/apps/rdap-lookup, blijft werken zonder verbinding zodra de pagina geladen is, en bewaart wat je opslaat in deze browser in plaats van op een server.</p>
    <p>Ook handig voor: whois, rdap, domain, registrar, expiry, ip, asn, nameserver.</p>
    <h2>Hoe het werkt</h2>
    <ul>
      <li>Open de pagina en ga aan de slag. Geen account, geen aanmelding, geen betaalmuur.</li>
      <li>Alles draait als JavaScript in je eigen browser, dus wat je invoert bereikt nooit een server.</li>
      <li>Instellingen en opgeslagen werk staan in deze browser en kunnen op elk moment gewist worden.</li>
      <li>De hele site is open source op <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
