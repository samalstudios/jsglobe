    <h1>Inspector AI</h1>
    <p>Stel vragen aan je eigen documenten, met bronvermelding. Dit hulpmiddel draait volledig in je browser: niets wat je plakt of opent verlaat je apparaat.</p>
    <h2>Wat Inspector AI doet</h2>
    <p>Inspector AI hoort bij het onderdeel Lokale AI van Toolbox en staat daar naast 5 verwante hulpmiddelen. Het opent meteen op https://jsglobe.com/nl/apps/inspector, blijft werken zonder verbinding zodra de pagina geladen is, en bewaart wat je opslaat in deze browser in plaats van op een server.</p>
    <p>Ook handig voor: rag, pdf, documents, questions, answers, references, search, retrieval, local ai, notes.</p>
    <h2>Hoe het werkt</h2>
    <ul>
      <li>Open de pagina en ga aan de slag. Geen account, geen aanmelding, geen betaalmuur.</li>
      <li>Alles draait als JavaScript in je eigen browser, dus wat je invoert bereikt nooit een server.</li>
      <li>Instellingen en opgeslagen werk staan in deze browser en kunnen op elk moment gewist worden.</li>
      <li>De hele site is open source op <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
