    <h1>Documentenstudio</h1>
    <p>Schrijf, maak op en exporteer documenten als PDF of Word, volledig in je browser. Dit hulpmiddel draait volledig in je browser: niets wat je plakt of opent verlaat je apparaat.</p>
    <h2>Wat Documentenstudio doet</h2>
    <p>Documentenstudio hoort bij het onderdeel Tekst van Toolbox en staat daar naast 7 verwante hulpmiddelen. Het opent meteen op https://jsglobe.com/nl/apps/doc-editor, blijft werken zonder verbinding zodra de pagina geladen is, en bewaart wat je opslaat in deze browser in plaats van op een server.</p>
    <p>Ook handig voor: document, word processor, editor, docx, pdf, write, rich text, export, pages.</p>
    <h2>Hoe het werkt</h2>
    <ul>
      <li>Open de pagina en ga aan de slag. Geen account, geen aanmelding, geen betaalmuur.</li>
      <li>Alles draait als JavaScript in je eigen browser, dus wat je invoert bereikt nooit een server.</li>
      <li>Instellingen en opgeslagen werk staan in deze browser en kunnen op elk moment gewist worden.</li>
      <li>De hele site is open source op <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Vragen</h2>
    <dl>
      <dt>Is Documentenstudio gratis?</dt><dd>Ja. Documentenstudio is gratis te gebruiken, zonder account, zonder aanmelding en zonder gebruikslimieten.</dd><dt>Uploadt Documentenstudio mijn gegevens?</dt><dd>Nee. Het draait volledig in je browser, dus de teksten, bestanden en afbeeldingen die je eraan geeft verlaten je apparaat nooit.</dd><dt>Werkt Documentenstudio zonder verbinding?</dt><dd>Ja. Zodra de pagina geladen is blijft het hulpmiddel werken zonder verbinding.</dd><dt>Waar vind ik de broncode?</dt><dd>Toolbox is open source op https://github.com/samalstudios/jsglobe.</dd>
    </dl>
