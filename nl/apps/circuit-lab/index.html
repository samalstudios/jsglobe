    <h1>Circuit Lab</h1>
    <p>Build and simulate basic electronic circuits. Dit hulpmiddel draait volledig in je browser: niets wat je plakt of opent verlaat je apparaat.</p>
    <h2>Wat Circuit Lab doet</h2>
    <p>Circuit Lab hoort bij het onderdeel Wetenschap van Toolbox en staat daar naast 5 verwante hulpmiddelen. Het opent meteen op https://jsglobe.com/nl/apps/circuit-lab, blijft werken zonder verbinding zodra de pagina geladen is, en bewaart wat je opslaat in deze browser in plaats van op een server.</p>
    <p>Ook handig voor: circuit, electronics, simulator, resistor, capacitor, spice, ohm, science.</p>
    <h2>Hoe het werkt</h2>
    <ul>
      <li>Open de pagina en ga aan de slag. Geen account, geen aanmelding, geen betaalmuur.</li>
      <li>Alles draait als JavaScript in je eigen browser, dus wat je invoert bereikt nooit een server.</li>
      <li>Instellingen en opgeslagen werk staan in deze browser en kunnen op elk moment gewist worden.</li>
      <li>De hele site is open source op <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Vragen</h2>
