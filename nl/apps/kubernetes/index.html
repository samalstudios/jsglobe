    <h2>Wat Kubernetes doet</h2>
    <p>Kubernetes hoort bij het onderdeel Ontwikkeling van Toolbox en staat daar naast 8 verwante hulpmiddelen. Het opent meteen op https://jsglobe.com/nl/apps/kubernetes, blijft werken zonder verbinding zodra de pagina geladen is, en bewaart wat je opslaat in deze browser in plaats van op een server.</p>
    <p>Ook handig voor: kubernetes, k8s, manifest, deployment, service, ingress, yaml, devops.</p>
    <h2>Hoe het werkt</h2>
    <ul>
      <li>Open de pagina en ga aan de slag. Geen account, geen aanmelding, geen betaalmuur.</li>
      <li>Alles draait als JavaScript in je eigen browser, dus wat je invoert bereikt nooit een server.</li>
      <li>Instellingen en opgeslagen werk staan in deze browser en kunnen op elk moment gewist worden.</li>
      <li>De hele site is open source op <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
