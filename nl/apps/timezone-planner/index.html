    <h1>Tijdzones</h1>
    <p>Zet steden naast elkaar en vind de overlappende uren. Dit hulpmiddel draait volledig in je browser: niets wat je plakt of opent verlaat je apparaat.</p>
    <h2>Wat Tijdzones doet</h2>
    <p>Tijdzones hoort bij het onderdeel Gereedschap van Toolbox en staat daar naast 8 verwante hulpmiddelen. Het opent meteen op https://jsglobe.com/nl/apps/timezone-planner, blijft werken zonder verbinding zodra de pagina geladen is, en bewaart wat je opslaat in deze browser in plaats van op een server.</p>
    <p>Ook handig voor: timezone, time zone, meeting, planner, utc, schedule, world clock.</p>
    <h2>Hoe het werkt</h2>
    <ul>
      <li>Open de pagina en ga aan de slag. Geen account, geen aanmelding, geen betaalmuur.</li>
      <li>Alles draait als JavaScript in je eigen browser, dus wat je invoert bereikt nooit een server.</li>
      <li>Instellingen en opgeslagen werk staan in deze browser en kunnen op elk moment gewist worden.</li>
      <li>De hele site is open source op <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Vragen</h2>
    <dl>
      <dt>Is Tijdzones gratis?</dt><dd>Ja. Tijdzones is gratis te gebruiken, zonder account, zonder aanmelding en zonder gebruikslimieten.</dd><dt>Uploadt Tijdzones mijn gegevens?</dt><dd>Nee. Het draait volledig in je browser, dus de teksten, bestanden en afbeeldingen die je eraan geeft verlaten je apparaat nooit.</dd><dt>Werkt Tijdzones zonder verbinding?</dt><dd>Ja. Zodra de pagina geladen is blijft het hulpmiddel werken zonder verbinding.</dd><dt>Waar vind ik de broncode?</dt><dd>Toolbox is open source op https://github.com/samalstudios/jsglobe.</dd>
    </dl>
