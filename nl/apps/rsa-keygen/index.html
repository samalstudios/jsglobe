    <h1>Sleutelpaar</h1>
    <p>Genereer RSA- en elliptische-kromme-sleutels als PEM. Dit hulpmiddel draait volledig in je browser: niets wat je plakt of opent verlaat je apparaat.</p>
    <h2>Wat Sleutelpaar doet</h2>
    <p>Sleutelpaar hoort bij het onderdeel Cryptografie en beveiliging van Toolbox en staat daar naast 8 verwante hulpmiddelen. Het opent meteen op https://jsglobe.com/nl/apps/rsa-keygen, blijft werken zonder verbinding zodra de pagina geladen is, en bewaart wat je opslaat in deze browser in plaats van op een server.</p>
    <p>Ook handig voor: rsa, key, pair, pem, ecdsa, public, private, ssh.</p>
    <h2>Hoe het werkt</h2>
    <ul>
      <li>Open de pagina en ga aan de slag. Geen account, geen aanmelding, geen betaalmuur.</li>
      <li>Alles draait als JavaScript in je eigen browser, dus wat je invoert bereikt nooit een server.</li>
      <li>Instellingen en opgeslagen werk staan in deze browser en kunnen op elk moment gewist worden.</li>
      <li>De hele site is open source op <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Vragen</h2>
    <dl>
      <dt>Is Sleutelpaar gratis?</dt><dd>Ja. Sleutelpaar is gratis te gebruiken, zonder account, zonder aanmelding en zonder gebruikslimieten.</dd><dt>Uploadt Sleutelpaar mijn gegevens?</dt><dd>Nee. Het draait volledig in je browser, dus de teksten, bestanden en afbeeldingen die je eraan geeft verlaten je apparaat nooit.</dd><dt>Werkt Sleutelpaar zonder verbinding?</dt><dd>Ja. Zodra de pagina geladen is blijft het hulpmiddel werken zonder verbinding.</dd><dt>Waar vind ik de broncode?</dt><dd>Toolbox is open source op https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Verwante hulpmiddelen</h2>
    <ul><li><a href="https://jsglobe.com/nl/apps/hash-text">Tekst hashen</a> - MD5-, SHA-1-, SHA-256- en SHA-512-hashes</li><li><a href="https://jsglobe.com/nl/apps/hmac-generator">HMAC</a> - Berichtauthenticatiecodes met een sleutel</li><li><a href="https://jsglobe.com/nl/apps/encryption">Versleutelen</a> - AES-GCM-tekstversleuteling met een wachtwoordzin</li><li><a href="https://jsglobe.com/nl/apps/token-generator">Tokengenerator</a> - Sterke willekeurige wachtwoorden en API-tokens</li><li><a href="https://jsglobe.com/nl/apps/otp-generator">TOTP</a> - Eenmalige wachtwoorden op tijdbasis uit een sleutel</li><li><a href="https://jsglobe.com/nl/apps/basic-auth">Basic Auth</a> - Bouw een Authorization-header uit inloggegevens</li><li><a href="https://jsglobe.com/nl/apps/password-strength">Wachtwoordsterkte</a> - Entropie, zwakke plekken en tijd om te kraken</li><li><a href="https://jsglobe.com/nl/apps/cert-decoder">Certificaat lezen</a> - Lees een X.509-certificaat of ondertekeningsverzoek</li></ul>
