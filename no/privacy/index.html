  <main>
    <h1>Personvernerklæring</h1>
    <p>Toolbox er et statisk nettsted. Hvert verktøy kjører i nettleseren din, og teksten, filene og bildene du bruker lastes aldri opp.</p>
    <h2>Informasjonskapsler</h2>
    <p>Google Analytics 4 lastes først når du godtar informasjonskapsel-varselet, med anonymisert IP og uten lagring for annonser eller tilpasning. Å avslå setter ingen analysekapsler. Du kan endre valget når som helst på denne siden eller i innstillingene.</p>
    <h2>Lokale data</h2>
    <p>Notater, oppgaver, innstillinger og apptilstand ligger i denne nettleserens local storage og IndexedDB, og kan slettes i innstillingene under Data. Det finnes ingen kontoer og ingen innsamling av e-postadresser.</p>
    <h2>Tredjeparter</h2>
    <p>Enkelte verktøy kaller en åpen tjeneste bare når du ber om det, som DNS-resolvere for oppslag, Cloudflare for hastighetstesten, CoinGecko og et åpent valutakursdatasett for porteføljepriser, og åpne CDN-er for KI-modeller og mediekodeker.</p>
    <h2>Kildekode</h2>
    <p>Nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</p>
    <p><a href="https://jsglobe.com/no/apps">Bla gjennom alle 129 verktøy</a></p>
