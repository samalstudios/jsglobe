    <h1>HTML-entiteter</h1>
    <p>Gjør om HTML-entiteter begge veier. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva HTML-entiteter gjør</h2>
    <p>HTML-entiteter hører til delen Web i Toolbox og står der ved siden av 8 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/html-entities, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: html, entities, escape, unescape, amp.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er HTML-entiteter gratis?</dt><dd>Ja. HTML-entiteter er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster HTML-entiteter opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker HTML-entiteter uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslektede verktøy</h2>
    <ul><li><a href="https://jsglobe.com/no/apps/url-encoder">URL-koding</a> - Prosentkod og dekod deler av en URL</li><li><a href="https://jsglobe.com/no/apps/url-parser">URL-tolk</a> - Del en URL i delene og spørreparameterne</li><li><a href="https://jsglobe.com/no/apps/jwt-parser">JWT-leser</a> - Dekod og se gjennom JSON Web Tokens</li><li><a href="https://jsglobe.com/no/apps/keycode-info">Tastekoder</a> - Se på tastaturhendelser tast for tast</li><li><a href="https://jsglobe.com/no/apps/slugify">Slug-verksted</a> - Gjør hvilken som helst tekst om til en ryddig URL-slug</li><li><a href="https://jsglobe.com/no/apps/http-status">HTTP-statuser</a> - Søkbart oppslagsverk over HTTP-statuskoder</li><li><a href="https://jsglobe.com/no/apps/http-headers">Headergjennomgang</a> - Vurder svarheadere for sikkerhet og personvern</li><li><a href="https://jsglobe.com/no/apps/css-gradient">Gradientverksted</a> - Bygg CSS-gradienter med fargestopp du kan dra</li></ul>
