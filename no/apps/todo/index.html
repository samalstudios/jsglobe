    <h1>Tasks</h1>
    <p>A lightweight checklist per workspace. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva Tasks gjør</h2>
    <p>Tasks hører til delen Verktøy i Toolbox og står der ved siden av 8 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/todo, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: todo, task, checklist, done.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er Tasks gratis?</dt><dd>Ja. Tasks er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster Tasks opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker Tasks uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslektede verktøy</h2>
    <ul><li><a href="https://jsglobe.com/no/apps/uuid-generator">UUID</a> - Generate v4 and v7 identifiers in bulk</li><li><a href="https://jsglobe.com/no/apps/device-info">Device Info</a> - Everything the browser knows about this device</li><li><a href="https://jsglobe.com/no/apps/clock">Clock</a> - World clocks, stopwatch and countdown timer</li><li><a href="https://jsglobe.com/no/apps/calendar">Calendar</a> - Month view with events saved per workspace</li><li><a href="https://jsglobe.com/no/apps/portfolio">Portfolio</a> - Track holdings, allocation and profit or loss</li><li><a href="https://jsglobe.com/no/apps/notes">Notes</a> - Quick scratch notes saved to this workspace</li><li><a href="https://jsglobe.com/no/apps/timezone-planner">Time Zones</a> - Line up cities and find the overlapping hours</li><li><a href="https://jsglobe.com/no/apps/iban-validator">IBAN Validator</a> - Check bank account numbers and read their parts</li></ul>
    <p><a href="https://jsglobe.com/no/apps">Bla gjennom alle 129 verktøy</a></p>
