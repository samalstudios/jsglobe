    <h1>Landenes virkelige størrelse</h1>
    
    <p>Dra land over kartet og sammenlign deres virkelige størrelse. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva Landenes virkelige størrelse gjør</h2>
    <p>Landenes virkelige størrelse hører til delen Vitenskap i Toolbox og står der ved siden av 6 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/true-size, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: true size of countries, compare country sizes, country size comparison, mercator projection, real size map, how big is greenland, country area, map distortion, world map, geography.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
