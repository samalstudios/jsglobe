    <h1>Kretslab</h1>
    <p>Bygg og simuler enkle elektroniske kretser. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva Kretslab gjør</h2>
    <p>Kretslab hører til delen Vitenskap i Toolbox og står der ved siden av 5 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/circuit-lab, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: circuit, electronics, simulator, resistor, capacitor, spice, ohm, science.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er Kretslab gratis?</dt><dd>Ja. Kretslab er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster Kretslab opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker Kretslab uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslektede verktøy</h2>
