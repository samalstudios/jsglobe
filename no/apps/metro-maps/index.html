    <h2>Hva T-banekart gjør</h2>
    <p>T-banekart hører til delen Verktøy i Toolbox og står der ved siden av 8 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/metro-maps, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: metro map, subway map, underground map, route planner, london underground map, paris metro map, berlin u-bahn map, madrid metro map, toronto subway map, seoul subway map, multi stop route planner, transit map.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
