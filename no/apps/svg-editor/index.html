    <h1>SVG Studio</h1>
    <p>View, clean, recolour and export SVG. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva SVG Studio gjør</h2>
    <p>SVG Studio hører til delen Medier i Toolbox og står der ved siden av 8 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/svg-editor, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: svg, vector, viewer, editor, optimise, optimize, icon, minify, png.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er SVG Studio gratis?</dt><dd>Ja. SVG Studio er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster SVG Studio opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker SVG Studio uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslektede verktøy</h2>
    <ul><li><a href="https://jsglobe.com/no/apps/qr-generator">QR Code</a> - Generate scannable QR codes offline</li><li><a href="https://jsglobe.com/no/apps/image-converter">Image Converter</a> - Convert, resize and compress images in the browser</li><li><a href="https://jsglobe.com/no/apps/media-converter">Video &amp; Audio</a> - Transcode video and audio with WebAssembly</li><li><a href="https://jsglobe.com/no/apps/barcode-generator">Barcode</a> - Code 128, EAN and Code 39 barcodes as SVG</li><li><a href="https://jsglobe.com/no/apps/icon-studio">Icon Studio</a> - Build an icon from thousands of parts, or describe one</li><li><a href="https://jsglobe.com/no/apps/favicon-generator">Favicon Maker</a> - Every icon size, an .ico and the manifest</li><li><a href="https://jsglobe.com/no/apps/exif-editor">Exif Metadata</a> - Read and strip metadata from JPEG photos</li><li><a href="https://jsglobe.com/no/apps/mp3-metadata">MP3 Metadata</a> - Edit ID3 tags and artwork on MP3 files</li></ul>
