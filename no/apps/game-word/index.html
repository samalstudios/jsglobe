    <h1>Gjett ordet</h1>
    <p>Seks forsøk på å finne ordet med fem bokstaver. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva Gjett ordet gjør</h2>
    <p>Gjett ordet hører til delen Spill i Toolbox og står der ved siden av 8 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/game-word, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: word, guess, wordle, letters, puzzle, game.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er Gjett ordet gratis?</dt><dd>Ja. Gjett ordet er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster Gjett ordet opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker Gjett ordet uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslektede verktøy</h2>
    <ul><li><a href="https://jsglobe.com/no/apps/typing-test">Skrivetest</a> - Ord per minutt, treffsikkerhet og vanskelige taster</li><li><a href="https://jsglobe.com/no/apps/chess">Sjakk</a> - Spill mot maskinen, lær åpninger og øv taktikk</li><li><a href="https://jsglobe.com/no/apps/game-sudoku">Sudoku</a> - Genererte oppgaver med notater og hint</li><li><a href="https://jsglobe.com/no/apps/game-tetris">Klosser</a> - Stable fallende brikker og rydd rader</li><li><a href="https://jsglobe.com/no/apps/game-memory">Memory</a> - Snu kort og finn parene</li><li><a href="https://jsglobe.com/no/apps/drum-kit">Trommesett</a> - Spill på pads og bygg en takt på 16 steg</li><li><a href="https://jsglobe.com/no/apps/tuner">Stemmeapparat</a> - Stem gitar, bass eller ukulele på gehør eller med mikrofon</li><li><a href="https://jsglobe.com/no/apps/midi-keyboard">MIDI-klaviatur</a> - Spillbar synth med datatastatur og MIDI-inngang</li></ul>
