    <h1>Hash Text</h1>
    <p>MD5, SHA-1, SHA-256, SHA-512 digests. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva Hash Text gjør</h2>
    <p>Hash Text hører til delen Krypto og sikkerhet i Toolbox og står der ved siden av 8 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/hash-text, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: hash, md5, sha, sha256, checksum, digest.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er Hash Text gratis?</dt><dd>Ja. Hash Text er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster Hash Text opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker Hash Text uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslektede verktøy</h2>
    <ul><li><a href="https://jsglobe.com/no/apps/hmac-generator">HMAC</a> - Keyed hash message authentication codes</li><li><a href="https://jsglobe.com/no/apps/encryption">Encrypt / Decrypt</a> - AES-GCM text encryption with a passphrase</li><li><a href="https://jsglobe.com/no/apps/token-generator">Token Generator</a> - Strong random passwords and API tokens</li><li><a href="https://jsglobe.com/no/apps/otp-generator">TOTP</a> - Time based one-time passwords from a secret</li><li><a href="https://jsglobe.com/no/apps/basic-auth">Basic Auth</a> - Build Authorization headers from credentials</li><li><a href="https://jsglobe.com/no/apps/rsa-keygen">Key Pair</a> - Generate RSA and elliptic curve keys as PEM</li><li><a href="https://jsglobe.com/no/apps/password-strength">Password Strength</a> - Entropy, weaknesses and time to crack</li><li><a href="https://jsglobe.com/no/apps/cert-decoder">Certificate Decoder</a> - Read an X.509 certificate or signing request</li></ul>
