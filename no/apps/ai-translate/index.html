    <h1>Oversett</h1>
    <p>Oversett tekst med en modell på denne enheten. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva Oversett gjør</h2>
    <p>Oversett hører til delen Lokal KI i Toolbox og står der ved siden av 5 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/ai-translate, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: translate, language, ai, localise, localize, spanish, french, japanese.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er Oversett gratis?</dt><dd>Ja. Oversett er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster Oversett opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker Oversett uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslektede verktøy</h2>
    <ul><li><a href="https://jsglobe.com/no/apps/ai-chat">KI-prat</a> - Snakk med en modell som kjører på denne enheten</li><li><a href="https://jsglobe.com/no/apps/ai-code">KI-kode</a> - Forklar, gjennomgå, dokumenter og oversett kode</li><li><a href="https://jsglobe.com/no/apps/ai-writer">KI-skribent</a> - Sammendrag, omskriving, oversetting og korrektur</li><li><a href="https://jsglobe.com/no/apps/ai-regex">KI-regex</a> - Beskriv et mønster og få et prøvd regulært uttrykk</li><li><a href="https://jsglobe.com/no/apps/inspector">Inspector AI</a> - Still spørsmål til dine egne dokumenter, med kildehenvisninger</li></ul>
