    <h1>SQL Formatter</h1>
    <p>Readable formatting for SQL statements. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva SQL Formatter gjør</h2>
    <p>SQL Formatter hører til delen Utvikling i Toolbox og står der ved siden av 8 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/sql-formatter, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: sql, format, query, pretty, database.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er SQL Formatter gratis?</dt><dd>Ja. SQL Formatter er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster SQL Formatter opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker SQL Formatter uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
