    <h1>Bluetooth</h1>
    <p>Les, abonner på og skriv GATT-egenskaper. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva Bluetooth gjør</h2>
    <p>Bluetooth hører til delen Verktøy i Toolbox og står der ved siden av 8 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/bluetooth-scanner, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: bluetooth, ble, gatt, device, scanner, characteristic, service, notify, subscribe, rssi, heart rate, battery.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er Bluetooth gratis?</dt><dd>Ja. Bluetooth er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster Bluetooth opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker Bluetooth uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslektede verktøy</h2>
    <ul><li><a href="https://jsglobe.com/no/apps/uuid-generator">UUID</a> - Lag v4- og v7-identifikatorer i mengde</li><li><a href="https://jsglobe.com/no/apps/device-info">Om enheten</a> - Alt nettleseren vet om denne enheten</li><li><a href="https://jsglobe.com/no/apps/clock">Klokke</a> - Verdensklokker, stoppeklokke og nedtelling</li><li><a href="https://jsglobe.com/no/apps/calendar">Kalender</a> - Månedsvisning med hendelser per arbeidsflate</li><li><a href="https://jsglobe.com/no/apps/portfolio">Portefølje</a> - Følg beholdninger, fordeling og gevinst eller tap</li><li><a href="https://jsglobe.com/no/apps/notes">Notater</a> - Raske notater lagret i denne arbeidsflaten</li><li><a href="https://jsglobe.com/no/apps/todo">Oppgaver</a> - En lett sjekkliste per arbeidsflate</li><li><a href="https://jsglobe.com/no/apps/timezone-planner">Tidssoner</a> - Still byer ved siden av hverandre og finn de felles timene</li></ul>
