    <h1>Domeneoppslag</h1>
    <p>RDAP-oppføringer for et domene, en IP-adresse eller et nett. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva Domeneoppslag gjør</h2>
    <p>Domeneoppslag hører til delen Nettverk i Toolbox og står der ved siden av 6 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/rdap-lookup, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: whois, rdap, domain, registrar, expiry, ip, asn, nameserver.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er Domeneoppslag gratis?</dt><dd>Ja. Domeneoppslag er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster Domeneoppslag opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker Domeneoppslag uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslektede verktøy</h2>
    <ul><li><a href="https://jsglobe.com/no/apps/subnet-calculator">Subnettregner</a> - IPv4-CIDR-områder, masker og antall verter</li><li><a href="https://jsglobe.com/no/apps/ip-converter">IP-omformer</a> - IPv4 desimalt, heksadesimalt, binært og oktalt</li><li><a href="https://jsglobe.com/no/apps/mac-generator">MAC-adresse</a> - Lag og skriv om MAC-adresser</li><li><a href="https://jsglobe.com/no/apps/dns-lookup">DNS-oppslag</a> - Oppslag i dig-stil over DNS-over-HTTPS</li><li><a href="https://jsglobe.com/no/apps/speed-test">Hastighetstest</a> - Mål nedlasting, opplasting, forsinkelse og jitter</li><li><a href="https://jsglobe.com/no/apps/websocket-tester">WebSocket-prøver</a> - Koble til en socket og følg rammene</li></ul>
