    <h1>Dokumentstudio</h1>
    <p>Skriv, formater og eksporter dokumenter som PDF eller Word, helt i nettleseren. Dette verktøyet kjører helt i nettleseren din: ingenting du limer inn eller åpner forlater enheten.</p>
    <h2>Hva Dokumentstudio gjør</h2>
    <p>Dokumentstudio hører til delen Tekst i Toolbox og står der ved siden av 7 beslektede verktøy. Det åpnes med én gang på https://jsglobe.com/no/apps/doc-editor, fortsetter å virke uten nett når siden først er lastet, og lagrer det du lagrer i denne nettleseren i stedet for på en tjener.</p>
    <p>Også nyttig til: document, word processor, editor, docx, pdf, write, rich text, export, pages.</p>
    <h2>Slik virker det</h2>
    <ul>
      <li>Åpne siden og sett i gang. Ingen konto, ingen registrering, ingen betalingsmur.</li>
      <li>Alt kjører som JavaScript i din egen nettleser, så det du skriver inn når aldri en tjener.</li>
      <li>Innstillinger og lagret arbeid ligger i denne nettleseren og kan tømmes når som helst.</li>
      <li>Hele nettstedet er åpen kildekode på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Spørsmål</h2>
    <dl>
      <dt>Er Dokumentstudio gratis?</dt><dd>Ja. Dokumentstudio er gratis å bruke, uten konto, uten registrering og uten bruksgrenser.</dd><dt>Laster Dokumentstudio opp dataene mine?</dt><dd>Nei. Det kjører helt i nettleseren din, så teksten, filene og bildene du gir det forlater aldri enheten.</dd><dt>Virker Dokumentstudio uten nett?</dt><dd>Ja. Når siden først er lastet, fortsetter verktøyet å virke uten forbindelse.</dd><dt>Hvor finner jeg kildekoden?</dt><dd>Toolbox er åpen kildekode på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Beslektede verktøy</h2>
    <ul><li><a href="https://jsglobe.com/no/apps/lorem-ipsum">Lorem Ipsum</a> - Fyllstoff i ord, setninger eller lister</li><li><a href="https://jsglobe.com/no/apps/text-stats">Tekststatistikk</a> - Opptellinger, lesetid og tegnanalyse</li><li><a href="https://jsglobe.com/no/apps/text-diff">Tekstsammenligning</a> - Sammenlign to tekster linje for linje</li><li><a href="https://jsglobe.com/no/apps/markdown-preview">Markdown</a> - Skriv markdown og se HTML-en</li><li><a href="https://jsglobe.com/no/apps/emoji-picker">Emoji</a> - Bla, søk og kopier emoji med kodepunktene deres</li><li><a href="https://jsglobe.com/no/apps/unicode-tables">Unicode-tabeller</a> - Bla gjennom Unicode-blokker og se på hvilket tegn som helst</li><li><a href="https://jsglobe.com/no/apps/letters">Bokstaver</a> - Lær greske, kyrilliske, japanske, koreanske og kinesiske tegn</li></ul>
