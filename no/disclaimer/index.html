    <h1>Forbehold</h1>
    <p>Verktøyene på Toolbox er forenklede modeller, prøvd mot gjennomregnede eksempler, men de utelater ting. Se på hvert resultat som et utgangspunkt som skal bekreftes.</p>
    <h2>Ikke faglig rådgivning</h2>
    <p>Ingenting her er juridisk, skattemessig, finansiell, medisinsk eller teknisk rådgivning, og bruken skaper ikke noe oppdragsforhold. Spør noen med kompetanse som kjenner situasjonen din når noe får virkelige følger.</p>
    <h2>Data fra andre steder</h2>
    <p>Enkelte verktøy henter data fra åpne tjenester når du ber om det, som valutakurser, priser og domeneoppslag. De dataene tilhører tjenestene, kan være forsinket eller feil, og sendes videre slik de kommer uten noen kontroll.</p>
    <h2>Tilbys som de er</h2>
    <p>Disse verktøyene kommer uten noen form for garanti. De kan inneholde feil, være utilgjengelige, endre seg eller forsvinne. Så langt loven tillater tas det ikke ansvar for tap som følger av å bruke dem eller å stole på det de gir.</p>
    <h2>Les koden</h2>
    <p>Nettstedet er åpen kildekode, så du kan se nøyaktig hva et verktøy gjør i stedet for å ta det på ordet. Feil er verdt å melde fra om.</p>
