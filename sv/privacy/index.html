    <h1>Integritetspolicy</h1>
    <p>Toolbox är en statisk webbplats. Varje verktyg körs i din webbläsare och texten, filerna och bilderna du använder laddas aldrig upp.</p>
    <h2>Kakor</h2>
    <p>Google Analytics 4 laddas först när du godtar kakbannern, med anonymiserad IP och utan lagring för annonser eller anpassning. Att neka sätter inga analyskakor. Du kan ändra valet när som helst på den här sidan eller i inställningarna.</p>
    <h2>Lokala uppgifter</h2>
    <p>Anteckningar, uppgifter, inställningar och apparnas tillstånd ligger i den här webbläsarens local storage och IndexedDB, och kan rensas i inställningarna under Data. Det finns inga konton och ingen insamling av e-postadresser.</p>
    <h2>Tredje parter</h2>
    <p>Vissa verktyg anropar en öppen tjänst bara när du ber om det, som DNS-resolvrar för uppslag, Cloudflare för hastighetstestet, CoinGecko och ett öppet växelkursdataset för portföljpriser, och öppna CDN:er för AI-modeller och mediakodekar.</p>
    <h2>Källkod</h2>
    <p>Webbplatsen är öppen källkod på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</p>
