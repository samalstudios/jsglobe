    <p>Verktygen på Toolbox är förenklade modeller, avstämda mot genomräknade exempel men med utelämnanden. Se varje resultat som en utgångspunkt att bekräfta.</p>

    <h2>Uppgifter från annat håll</h2>
    <p>Vissa verktyg hämtar uppgifter från öppna tjänster när du ber om det, som växelkurser, priser och domänuppslag. De uppgifterna tillhör tjänsterna, kan vara fördröjda eller fel, och skickas vidare som de kommer utan någon kontroll.</p>
    <h2>Erbjuds som de är</h2>
    <p>De här verktygen kommer utan någon som helst garanti. De kan innehålla fel, vara otillgängliga, ändras eller försvinna. I den mån lagen tillåter tas inget ansvar för förlust som uppstår av att använda dem eller att lita på vad de ger.</p>
