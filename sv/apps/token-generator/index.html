    <h1>Token Generator</h1>
    <p>Strong random passwords and API tokens. Det här verktyget körs helt i din webbläsare: inget du klistrar in eller öppnar lämnar din enhet.</p>
    <h2>Vad Token Generator gör</h2>
    <p>Token Generator hör till avsnittet Krypto och säkerhet i Toolbox och står där bredvid 8 närliggande verktyg. Det öppnas direkt på https://jsglobe.com/sv/apps/token-generator, fortsätter fungera utan uppkoppling när sidan väl laddats, och sparar det du sparar i den här webbläsaren i stället för på en server.</p>
    <p>Också bra för: password, token, random, secret, entropy.</p>
    <h2>Så fungerar det</h2>
    <ul>
      <li>Öppna sidan och sätt igång. Inget konto, ingen registrering, ingen betalvägg.</li>
      <li>Allt körs som JavaScript i din egen webbläsare, så det du matar in når aldrig en server.</li>
      <li>Inställningar och sparat arbete ligger i den här webbläsaren och kan rensas när som helst.</li>
      <li>Hela webbplatsen är öppen källkod på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Frågor</h2>
    <dl>
      <dt>Är Token Generator gratis?</dt><dd>Ja. Token Generator är gratis att använda, utan konto, utan registrering och utan användningsgränser.</dd><dt>Laddar Token Generator upp mina uppgifter?</dt><dd>Nej. Det körs helt i din webbläsare, så texten, filerna och bilderna du ger det lämnar aldrig din enhet.</dd><dt>Fungerar Token Generator utan uppkoppling?</dt><dd>Ja. När sidan väl laddats fortsätter verktyget fungera utan uppkoppling.</dd><dt>Var hittar jag källkoden?</dt><dd>Toolbox är öppen källkod på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Närliggande verktyg</h2>
    <ul><li><a href="https://jsglobe.com/sv/apps/hash-text">Hash Text</a> - MD5, SHA-1, SHA-256, SHA-512 digests</li><li><a href="https://jsglobe.com/sv/apps/hmac-generator">HMAC</a> - Keyed hash message authentication codes</li><li><a href="https://jsglobe.com/sv/apps/encryption">Encrypt / Decrypt</a> - AES-GCM text encryption with a passphrase</li><li><a href="https://jsglobe.com/sv/apps/otp-generator">TOTP</a> - Time based one-time passwords from a secret</li><li><a href="https://jsglobe.com/sv/apps/basic-auth">Basic Auth</a> - Build Authorization headers from credentials</li><li><a href="https://jsglobe.com/sv/apps/rsa-keygen">Key Pair</a> - Generate RSA and elliptic curve keys as PEM</li><li><a href="https://jsglobe.com/sv/apps/password-strength">Password Strength</a> - Entropy, weaknesses and time to crack</li><li><a href="https://jsglobe.com/sv/apps/cert-decoder">Certificate Decoder</a> - Read an X.509 certificate or signing request</li></ul>
