    <h1>SSH-nycklar</h1>
    <p>Skapa och granska OpenSSH-nycklar utan uppkoppling. Det här verktyget körs helt i din webbläsare: inget du klistrar in eller öppnar lämnar din enhet.</p>
    <h2>Vad SSH-nycklar gör</h2>
    <p>SSH-nycklar hör till avsnittet Krypto och säkerhet i Toolbox och står där bredvid 8 närliggande verktyg. Det öppnas direkt på https://jsglobe.com/sv/apps/ssh-keys, fortsätter fungera utan uppkoppling när sidan väl laddats, och sparar det du sparar i den här webbläsaren i stället för på en server.</p>
    <p>Också bra för: ssh, key, ed25519, rsa, ecdsa, keygen, fingerprint, authorized_keys, openssh.</p>
    <h2>Så fungerar det</h2>
    <ul>
      <li>Öppna sidan och sätt igång. Inget konto, ingen registrering, ingen betalvägg.</li>
      <li>Allt körs som JavaScript i din egen webbläsare, så det du matar in når aldrig en server.</li>
      <li>Inställningar och sparat arbete ligger i den här webbläsaren och kan rensas när som helst.</li>
      <li>Hela webbplatsen är öppen källkod på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Frågor</h2>
    <dl>
      <dt>Är SSH-nycklar gratis?</dt><dd>Ja. SSH-nycklar är gratis att använda, utan konto, utan registrering och utan användningsgränser.</dd><dt>Laddar SSH-nycklar upp mina uppgifter?</dt><dd>Nej. Det körs helt i din webbläsare, så texten, filerna och bilderna du ger det lämnar aldrig din enhet.</dd><dt>Fungerar SSH-nycklar utan uppkoppling?</dt><dd>Ja. När sidan väl laddats fortsätter verktyget fungera utan uppkoppling.</dd><dt>Var hittar jag källkoden?</dt><dd>Toolbox är öppen källkod på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Närliggande verktyg</h2>
    <ul><li><a href="https://jsglobe.com/sv/apps/hash-text">Hasha text</a> - MD5-, SHA-1-, SHA-256- och SHA-512-summor</li><li><a href="https://jsglobe.com/sv/apps/hmac-generator">HMAC</a> - Meddelandeautentiseringskoder med nyckel</li><li><a href="https://jsglobe.com/sv/apps/encryption">Kryptera</a> - AES-GCM-textkryptering med en lösenfras</li><li><a href="https://jsglobe.com/sv/apps/token-generator">Tokengenerator</a> - Starka slumpmässiga lösenord och API-tokens</li><li><a href="https://jsglobe.com/sv/apps/otp-generator">TOTP</a> - Tidsbaserade engångslösenord ur en nyckel</li><li><a href="https://jsglobe.com/sv/apps/basic-auth">Basic Auth</a> - Bygg en Authorization-rubrik av inloggningsuppgifter</li><li><a href="https://jsglobe.com/sv/apps/rsa-keygen">Nyckelpar</a> - Skapa RSA- och elliptiska kurv-nycklar som PEM</li><li><a href="https://jsglobe.com/sv/apps/password-strength">Lösenordsstyrka</a> - Entropi, svagheter och tid att knäcka</li></ul>
