    <h1>XML-formatering</h1>
    <p>Dra in och minifiera XML- eller HTML-uppmärkning. Det här verktyget körs helt i din webbläsare: inget du klistrar in eller öppnar lämnar din enhet.</p>
    <h2>Vad XML-formatering gör</h2>
    <p>XML-formatering hör till avsnittet Utveckling i Toolbox och står där bredvid 8 närliggande verktyg. Det öppnas direkt på https://jsglobe.com/sv/apps/xml-formatter, fortsätter fungera utan uppkoppling när sidan väl laddats, och sparar det du sparar i den här webbläsaren i stället för på en server.</p>
    <p>Också bra för: xml, html, format, pretty, indent.</p>
    <h2>Så fungerar det</h2>
    <ul>
      <li>Öppna sidan och sätt igång. Inget konto, ingen registrering, ingen betalvägg.</li>
      <li>Allt körs som JavaScript i din egen webbläsare, så det du matar in når aldrig en server.</li>
      <li>Inställningar och sparat arbete ligger i den här webbläsaren och kan rensas när som helst.</li>
      <li>Hela webbplatsen är öppen källkod på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
    <h2>Frågor</h2>
    <dl>
      <dt>Är XML-formatering gratis?</dt><dd>Ja. XML-formatering är gratis att använda, utan konto, utan registrering och utan användningsgränser.</dd><dt>Laddar XML-formatering upp mina uppgifter?</dt><dd>Nej. Det körs helt i din webbläsare, så texten, filerna och bilderna du ger det lämnar aldrig din enhet.</dd><dt>Fungerar XML-formatering utan uppkoppling?</dt><dd>Ja. När sidan väl laddats fortsätter verktyget fungera utan uppkoppling.</dd><dt>Var hittar jag källkoden?</dt><dd>Toolbox är öppen källkod på https://github.com/samalstudios/jsglobe.</dd>
    </dl>
    <h2>Närliggande verktyg</h2>
