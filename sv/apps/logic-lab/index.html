    <h1>Logiklabb</h1>
    <p>Grindar, vippor, räknare, avkodare och lysdiodsdisplayer. Det här verktyget körs helt i din webbläsare: inget du klistrar in eller öppnar lämnar din enhet.</p>
    <h2>Vad Logiklabb gör</h2>
    <p>Logiklabb hör till avsnittet Vetenskap i Toolbox och står där bredvid 5 närliggande verktyg. Det öppnas direkt på https://jsglobe.com/sv/apps/logic-lab, fortsätter fungera utan uppkoppling när sidan väl laddats, och sparar det du sparar i den här webbläsaren i stället för på en server.</p>
    <p>Också bra för: logic, digital, gate, and, or, xor, flip-flop, counter, seven segment, led matrix, decoder, multiplexer, boolean, circuit.</p>
    <h2>Så fungerar det</h2>
    <ul>
      <li>Öppna sidan och sätt igång. Inget konto, ingen registrering, ingen betalvägg.</li>
      <li>Allt körs som JavaScript i din egen webbläsare, så det du matar in når aldrig en server.</li>
      <li>Inställningar och sparat arbete ligger i den här webbläsaren och kan rensas när som helst.</li>
      <li>Hela webbplatsen är öppen källkod på <a href="https://github.com/samalstudios/jsglobe">https://github.com/samalstudios/jsglobe</a>.</li>
    </ul>
